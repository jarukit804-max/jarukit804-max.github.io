<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FINAL V11 - ปุ่มกดได้ 100%</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:420px}button{cursor:pointer}</style></head><body class="bg-slate-100 min-h-screen">
<div id="sirenBanner" class="hidden fixed top-0 left-0 right-0 z-[70] bg-red-600 text-white p-4 flex justify-between items-center"><div><b>🚨 เคสใหม่! </b><span id="sirenId"></span></div><button onclick="stopSiren()" class="bg-white text-red-700 px-4 py-2 rounded-full font-bold">หยุด</button></div>
<header class="bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40"><div><h1 class="font-bold text-sm">🛡️ FINAL V11 - ปุ่มกดได้ 100%</h1><p class="text- text-emerald-300">✅ แก้ปุ่ม กำลังไปช่วย / เสร็จภารกิจ</p></div><div class="flex gap-1"><button id="soundBtn" type="button" onclick="enableSound()" class="bg-yellow-400 text-black px-3 py-1.5 rounded-full text- font-bold">🔊 เปิดเสียง</button><button type="button" onclick="logout()" class="bg-slate-700 px-2 py-1 rounded-full text-">ออก</button></div></header>
<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-2xl shadow"><h2 class="font-bold text-center">🔐 เข้าสู่ระบบ</h2><input id="email" placeholder="อีเมล" class="w-full mt-3 p-3 border rounded-xl"><input id="password" type="password" placeholder="รหัสผ่าน" class="w-full mt-2 p-3 border rounded-xl"><button type="button" onclick="login()" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-xl font-bold">เข้าสู่ระบบ</button><p id="loginMsg" class="text- text-center mt-2 text-red-500"></p></div>
<main id="mainContent" class="hidden max-w-6xl mx-auto p-3"><div class="bg-blue-50 border rounded-xl p-2 mb-2 flex justify-between"><div class="text-"><b>📅 บันทึกออนไลน์:</b> <span id="onlineClock" class="font-bold text-blue-700">-</span> | <span id="debug" class="text-slate-500">พร้อม</span></div><button type="button" onclick="testSiren()" class="bg-red-600 text-white px-3 py-1 rounded-full text-">🔊 เทส</button></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="md:col-span-2 bg-white rounded-2xl border overflow-hidden"><div id="map"></div></div><div class="bg-white rounded-2xl border h- overflow-y-auto"><div id="caseList" class="p-2 space-y-2"></div></div></div><div class="bg-white rounded-2xl border mt-3 p-3"><h3 class="font-bold text-sm">📜 Log ถาวร - ปุ่มกดได้ 100%</h3><div class="overflow-auto max-h-"><table class="w-full text-"><thead class="bg-slate-100 sticky top-0"><tr><th class="p-2">เวลา พ.ศ.</th><th>รหัส</th><th>ชื่อ</th><th>เบอร์</th><th>AI</th><th>📍 GPS</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="logTable"></tbody></table></div></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs", authDomain: "hatyai-rescue.firebaseapp.com", projectId: "hatyai-rescue", storageBucket: "hatyai-rescue.firebasestorage.app", messagingSenderId: "489517472133", appId: "1:489517472133:web:bf6769bbd62f312cbd0cec" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
let map=null,markers=null,cases=[],audioCtx=null,osc1=null,sirenInterval=null,soundEnabled=false,seenIds=new Set(),firstLoad=true;
function updateClock(){ const now=new Date(); const be=now.getFullYear()+543; document.getElementById('onlineClock').innerText=`${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH')} (พ.ศ. ${be})`; } setInterval(updateClock,1000); updateClock();
function initAudio(){ if(!audioCtx){ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); } if(audioCtx.state==='suspended') audioCtx.resume(); }
window.enableSound=()=>{ initAudio(); soundEnabled=true; localStorage.setItem('hatyai_sound_enabled','true'); document.getElementById('soundBtn').innerText='✅ เปิดแล้ว'; playSiren(true,1200); setTimeout(stopSiren,1200); };
function playSiren(crit,dur){ if(!soundEnabled) return; initAudio(); stopSiren(); try{ const gain=audioCtx.createGain(); gain.gain.value=0.8; gain.connect(audioCtx.destination); osc1=audioCtx.createOscillator(); osc1.type='sawtooth'; osc1.connect(gain); osc1.start(); let high=true; sirenInterval=setInterval(()=>{ high=!high; try{ osc1.frequency.value=high?(crit?1200:900):600; }catch(e){} }, 150); if(dur) setTimeout(stopSiren,dur); }catch(e){} }
window.testSiren=()=>{ if(!soundEnabled){ enableSound(); return; } document.getElementById('sirenBanner').classList.remove('hidden'); playSiren(true,5000); };
window.stopSiren=()=>{ if(sirenInterval) clearInterval(sirenInterval); try{ osc1&&osc1.stop(); }catch(e){} document.getElementById('sirenBanner').classList.add('hidden'); };
window.login=async()=>{ try{ await signInWithEmailAndPassword(auth, email.value, password.value); }catch(e){ loginMsg.innerText=e.message; } }; window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{ if(u){ loginBox.classList.add('hidden'); mainContent.classList.remove('hidden'); if(!map){ map=L.map('map').setView([7.008,100.4747],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); markers=L.layerGroup().addTo(map); } initAudio(); listen(); }else{ loginBox.classList.remove('hidden'); mainContent.classList.add('hidden'); } });
window.updateStatus=async(fid, newStatus)=>{
  document.getElementById('debug').innerText='⏳ อัปเดต '+fid+' -> '+newStatus;
  try{
    await updateDoc(doc(db,'cases',fid), { status: newStatus, updatedAt: serverTimestamp(), updatedAtText: new Date().toLocaleString('th-TH') });
    document.getElementById('debug').innerText='✅ '+newStatus;
  }catch(e){
    document.getElementById('debug').innerText='❌ '+e.message;
    alert('อัปเดตไม่สำเร็จ: '+e.message+'\n\nไปที่ Firebase Console > Firestore > Rules แล้วแก้เป็น:\nrules_version=\'2\'; service cloud.firestore { match /databases/{database}/documents { match /{document=**} { allow read, write: if true; } } }');
    const c=cases.find(x=>x.fid===fid); if(c) c.status=newStatus; render();
  }
};
window.deleteCase=async(fid)=>{ if(!confirm('ลบ? '+fid)) return; try{ await deleteDoc(doc(db,'cases',fid)); }catch(e){ alert(e.message); } };
function listen(){ const q=query(collection(db,'cases'), orderBy('createdAt','desc')); onSnapshot(q,s=>{ const arr=s.docs.map(d=>({fid:d.id,...d.data()})); arr.forEach(c=>seenIds.add(c.fid)); firstLoad=false; cases=arr; render(); }); }
function render(){ if(markers) markers.clearLayers(); caseList.innerHTML=''; logTable.innerHTML=''; cases.forEach(c=>{ if(c.lat&&c.lng&&markers) L.circleMarker([c.lat,c.lng],{radius:10,color:c.priority===3?'red':'green',fillOpacity:0.8}).addTo(markers).bindPopup(`<b>${c.name}</b><br>${c.status||''}`); const gmaps=`https://maps.google.com/?q=${c.lat},${c.lng}`; const statusColor=c.status==='กำลังไปช่วย'?'bg-amber-100 text-amber-800':c.status==='เสร็จแล้ว'?'bg-emerald-100 text-emerald-800':'bg-red-50 text-red-700'; const tr=document.createElement('tr'); tr.className='border-b'; tr.innerHTML=`<td class="p-1 text-">${c.logTime||''}<br><span class="text- px-1 rounded border ${statusColor}">${c.status||'รอช่วยเหลือ'}</span></td><td class="font-mono text-">${c.id||c.fid.slice(-6)}</td><td class="font-bold">${c.name}</td><td>${c.phone}</td><td class="text-">${c.ai?.label||''}</td><td class="p-1"><div class="font-mono text- text-blue-700">${c.lat},${c.lng}</div><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white px-2 py-1 rounded text- block text-center">🗺️ แผนที่</a></td><td class="max-w- truncate text-">${c.detail||''}</td><td><div class="flex flex-col gap-1 w-"><button type="button" onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 hover:bg-amber-600 text-white px-2 py-2 rounded-full font-bold text-">🚤 เข้าช่วยเหลือ</button><button type="button" onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-2 rounded-full font-bold text-">✅ เสร็จแล้ว</button><div class="text- text-center">${c.status||''}</div></div></td>`; logTable.appendChild(tr); const card=document.createElement('div'); card.className='p-2 border-2 rounded-xl text-xs '+(c.status==='กำลังไปช่วย'?'bg-amber-50 border-amber-300':c.status==='เสร็จแล้ว'?'bg-emerald-50 border-emerald-300':'bg-slate-50'); card.innerHTML=`<div class="flex justify-between"><b>${c.name}</b><span class="text- px-2 py-0.5 rounded-full border ${statusColor}">${c.status||'รอช่วยเหลือ'}</span></div><div>${c.detail||''}</div><div class="flex gap-1 mt-2"><button type="button" onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="flex-1 bg-amber-500 text-white py-2 rounded-full font-bold text-">🚤 เข้าช่วยเหลือ</button><button type="button" onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="flex-1 bg-emerald-600 text-white py-2 rounded-full font-bold text-">✅ เสร็จแล้ว</button></div>`; caseList.appendChild(card); }); }
window.copyGPS=(la,ln)=>{ navigator.clipboard.writeText(la+','+ln); };
window.focusMap=(la,ln)=>{ if(map&&la&&ln) map.setView([la][ln],16); };
</script></body></html>
