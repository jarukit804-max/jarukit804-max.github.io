<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FINAL V10 - เสียงดังลั่น 100% + Log ออนไลน์</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{font-family:'Prompt',sans-serif}#map{height:420px}</style></head><body class="bg-slate-100 min-h-screen">
<div id="sirenBanner" class="hidden fixed top-0 left-0 right-0 z-[70] bg-red-600 text-white p-4 flex justify-between items-center"><div><b>🚨 เคสใหม่เข้า! </b><span id="sirenId"></span> <span id="sirenAI"></span><div id="sirenDetail" class="text-xs"></div></div><button onclick="stopSiren()" class="bg-white text-red-700 px-4 py-2 rounded-full font-bold">🔇 หยุดเสียง</button></div>
<header class="bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40"><div><h1 class="font-bold text-sm">🛡️ FINAL V10 - เสียงดังลั่น</h1><p class="text- text-emerald-300">✅ แก้เสียงไม่ดัง + Log ออนไลน์ + GPS 3 ปุ่ม</p></div><div class="flex gap-1"><button id="soundBtn" type="button" onclick="enableSound()" class="bg-yellow-400 text-black px-4 py-2 rounded-full text- font-black animate-pulse">🔊 กดเพื่อเปิดเสียงดังลั่น</button><button type="button" onclick="logout()" class="bg-slate-700 px-2 py-1 rounded-full text-">ออก</button></div></header>
<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-2xl shadow"><h2 class="font-bold text-center">🔐 เข้าสู่ระบบ</h2><input id="email" placeholder="อีเมล" class="w-full mt-3 p-3 border rounded-xl"><input id="password" type="password" placeholder="รหัสผ่าน" class="w-full mt-2 p-3 border rounded-xl"><button type="button" onclick="login()" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-xl font-bold">เข้าสู่ระบบ</button></div>
<main id="mainContent" class="hidden max-w-6xl mx-auto p-3"><div class="bg-blue-50 border-2 border-blue-200 rounded-xl p-3 mb-3 flex justify-between items-center"><div><div class="font-bold text-">📅 บันทึกเคสออนไลน์: <span id="onlineClock" class="text-blue-700">-</span></div><div class="text-"><span id="soundStatus" class="font-bold text-red-600">🔇 เสียงปิดอยู่ - กดปุ่มเหลือง 🔊 ด้านบน 1 ครั้ง</span></div></div><button type="button" onclick="testSiren()" class="bg-red-600 text-white px-4 py-2 rounded-full text- font-bold">🔊 เทสไซเรนดังลั่น</button></div><div class="grid grid-cols-4 gap-2 mb-3"><div class="bg-white p-3 rounded-xl text-center border"><div id="countAll" class="font-bold text-xl">0</div></div><div class="bg-red-50 border-2 p-3 rounded-xl text-center"><div id="countRed" class="font-bold text-xl text-red-600">0</div></div><div class="bg-amber-50 p-3 rounded-xl text-center"><div id="countYellow" class="font-bold text-xl">0</div></div><div class="bg-emerald-50 p-3 rounded-xl text-center"><div id="countGreen" class="font-bold text-xl">0</div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="md:col-span-2 bg-white rounded-2xl border overflow-hidden"><div id="map"></div></div><div class="bg-white rounded-2xl border h- overflow-y-auto"><div id="caseList" class="p-2 space-y-2"></div></div></div><div class="bg-white rounded-2xl border mt-3 p-3"><h3 class="font-bold text-sm">📜 Log ถาวร - บันทึกเคสออนไลน์ + GPS 3 ปุ่ม + เสียงดัง</h3><div class="overflow-auto max-h- mt-2"><table class="w-full text-"><thead class="bg-slate-100 sticky top-0"><tr><th class="p-2">เวลา พ.ศ. / ออนไลน์</th><th>รหัส</th><th>ชื่อ</th><th>เบอร์</th><th>AI</th><th>📍 GPS กดได้</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="logTable"></tbody></table></div></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs", authDomain: "hatyai-rescue.firebaseapp.com", projectId: "hatyai-rescue", storageBucket: "hatyai-rescue.firebasestorage.app", messagingSenderId: "489517472133", appId: "1:489517472133:web:bf6769bbd62f312cbd0cec" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
let map=null,markers=null,cases=[],audioCtx=null,masterGain=null,osc1=null,osc2=null,sirenInterval=null,soundEnabled=false,seenIds=new Set(),firstLoad=true;
function updateClock(){ const now=new Date(); const be=now.getFullYear()+543; document.getElementById('onlineClock').innerText=`${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH')} (พ.ศ. ${be})`; } setInterval(updateClock,1000); updateClock();
function initAudio(){ if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); masterGain=audioCtx.createGain(); masterGain.gain.value=1.0; masterGain.connect(audioCtx.destination); } if(audioCtx.state==='suspended') audioCtx.resume(); }
function updateSoundUI(on){ const btn=document.getElementById('soundBtn'); const st=document.getElementById('soundStatus'); if(on){ btn.innerText='✅ เสียงเปิดดังลั่นแล้ว'; btn.className='bg-emerald-500 text-white px-4 py-2 rounded-full text- font-bold'; st.innerText='🔊 เสียงเปิดแล้ว - พร้อมดัง'; st.className='font-bold text-emerald-600'; }else{ btn.innerText='🔊 กดเพื่อเปิดเสียงดังลั่น'; btn.className='bg-yellow-400 text-black px-4 py-2 rounded-full text- font-black animate-pulse'; st.innerText='🔇 เสียงปิดอยู่ - กดปุ่มเหลือง 🔊 ด้านบน 1 ครั้ง'; st.className='font-bold text-red-600'; } }
window.enableSound=()=>{ initAudio(); soundEnabled=true; localStorage.setItem('hatyai_sound_enabled','true'); updateSoundUI(true); playLoudSiren(true,1500); setTimeout(stopSiren,1500); };
function playLoudSiren(isCritical, durationMs){ if(!soundEnabled) return; initAudio(); stopSiren(); try{ osc1=audioCtx.createOscillator(); osc1.type='sawtooth'; osc1.frequency.value=800; osc2=audioCtx.createOscillator(); osc2.type='square'; osc2.frequency.value=600; const g1=audioCtx.createGain(); g1.gain.value=0.7; const g2=audioCtx.createGain(); g2.gain.value=0.5; osc1.connect(g1); g1.connect(masterGain); osc2.connect(g2); g2.connect(masterGain); osc1.start(); osc2.start(); let high=true; const dur=durationMs||(isCritical?25000:15000); sirenInterval=setInterval(()=>{ high=!high; const f1=high?(isCritical?1200:900):(isCritical?700:500); const f2=high?(isCritical?900:700):(isCritical?500:350); try{ osc1.frequency.setValueAtTime(f1, audioCtx.currentTime); osc2.frequency.setValueAtTime(f2, audioCtx.currentTime); }catch(e){} }, isCritical?180:350); if(dur>0) setTimeout(stopSiren,dur); }catch(e){} }
window.testSiren=()=>{ if(!soundEnabled){ enableSound(); return; } document.getElementById('sirenBanner').classList.remove('hidden'); document.getElementById('sirenId').innerText='ทดสอบเสียงดังลั่น'; playLoudSiren(true,5000); };
window.stopSiren=()=>{ if(sirenInterval) clearInterval(sirenInterval); try{ osc1&&osc1.stop(); }catch(e){} try{ osc2&&osc2.stop(); }catch(e){} document.getElementById('sirenBanner').classList.add('hidden'); };
window.login=async()=>{ await signInWithEmailAndPassword(auth, email.value, password.value); }; window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{ if(u){ loginBox.classList.add('hidden'); mainContent.classList.remove('hidden'); if(!map){ map=L.map('map').setView([7.008,100.4747],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); markers=L.layerGroup().addTo(map); } initAudio(); listen(); }else{ loginBox.classList.remove('hidden'); mainContent.classList.add('hidden'); } });
function listen(){ const q=query(collection(db,'cases'), orderBy('createdAt','desc')); onSnapshot(q,s=>{ const arr=s.docs.map(d=>({fid:d.id,...d.data()})); const newOnes=arr.filter(c=>!seenIds.has(c.fid)); if(!firstLoad && newOnes.length>0 && soundEnabled){ const n=newOnes[0]; document.getElementById('sirenId').innerText=n.id||n.fid; document.getElementById('sirenBanner').classList.remove('hidden'); playLoudSiren(n.priority===3); } arr.forEach(c=>seenIds.add(c.fid)); firstLoad=false; cases=arr; render(); }); }
function render(){ document.getElementById('countAll').innerText=cases.length; if(markers) markers.clearLayers(); caseList.innerHTML=''; logTable.innerHTML=''; cases.forEach(c=>{ const gmaps=`https://maps.google.com/?q=${c.lat},${c.lng}`; const gps=`<div class="bg-blue-50 border-2 rounded-xl p-2 mt-2"><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white px-2 py-1 rounded text-">🗺️ แผนที่</a> <button onclick="navigator.clipboard.writeText('${c.lat},${c.lng}')" class="bg-slate-200 px-2 py-1 rounded text-">📋 ก็อป</button></div>`; const card=document.createElement('div'); card.innerHTML=`<b>${c.name}</b> ${c.phone}<br>${c.detail||''}${gps}<br><button onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-3 py-2 rounded-full font-bold text-">🚤 เข้าช่วยเหลือ</button>`; caseList.appendChild(card); const tr=document.createElement('tr'); tr.innerHTML=`<td class="text-">${c.logTime||''}<br><span class="text- text-blue-600">${c.onlineDateTime||''}</span></td><td>${c.id||c.fid}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.ai?.label||''}</td><td>${c.lat},${c.lng}</td><td>${c.detail||''}</td><td><button onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-2 py-1 rounded text-">🚤 เข้าช่วยเหลือ</button><button onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="bg-emerald-600 text-white px-2 py-1 rounded text-">✅ เสร็จ</button></td>`; logTable.appendChild(tr); }); }
window.updateStatus=async(fid,s)=>{ await updateDoc(doc(db,'cases',fid),{status:s}); };
</script></body></html>
