<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FINAL V8 - กดได้ 100% + GPS</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{font-family:'Prompt',sans-serif}#map{height:420px}.btn{cursor:pointer;}</style></head><body class="bg-slate-100 min-h-screen">
<div id="sirenBanner" class="hidden fixed top-0 left-0 right-0 z-50 bg-red-700 text-white p-3 flex justify-between items-center"><div><b>🚨 เคสใหม่! </b><span id="sirenId"></span> <span id="sirenAI"></span><div id="sirenDetail" class="text-xs"></div></div><button onclick="stopSiren()" class="bg-white text-red-700 px-3 py-1 rounded-full text-xs">หยุด</button></div>
<header class="bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40"><div><h1 class="font-bold text-sm">🛡️ FINAL V8 - กดได้ 100%</h1><p class="text- text-emerald-300">✅ ไม่บังจอ + ช่วยเหลือ + GPS 3 ปุ่ม + ลบ</p></div><div class="flex gap-2"><button type="button" onclick="testSiren()" class="bg-yellow-500 text-black px-2 py-1.5 rounded-full text- font-bold">🔊 เทสเสียง</button><button type="button" onclick="deleteTestCases()" class="bg-orange-500 text-white px-3 py-1.5 rounded-full text- font-bold">🗑️ ลบทดสอบ</button><button type="button" onclick="deleteAllCases()" class="bg-red-600 text-white px-3 py-1.5 rounded-full text- font-bold">❌ ลบทั้งหมด</button><button type="button" onclick="logout()" class="bg-slate-700 text-white px-3 py-1 rounded-full text-">ออก</button></div></header>
<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-2xl shadow"><h2 class="font-bold text-center">🔐 เข้าสู่ระบบ</h2><input id="email" placeholder="อีเมล" class="w-full mt-3 p-3 border rounded-xl"><input id="password" type="password" placeholder="รหัสผ่าน" class="w-full mt-2 p-3 border rounded-xl"><button type="button" onclick="login()" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-xl font-bold">เข้าสู่ระบบ</button></div>
<main id="mainContent" class="hidden max-w-6xl mx-auto p-3"><div class="grid grid-cols-4 gap-2 mb-3"><div class="bg-white p-3 rounded-xl text-center border"><div class="text-">ทั้งหมด</div><div id="countAll" class="font-bold text-xl">0</div></div><div class="bg-red-50 border p-3 rounded-xl text-center"><div class="text- text-red-600">🔴 วิกฤต</div><div id="countRed" class="font-bold text-xl text-red-600">0</div></div><div class="bg-amber-50 border p-3 rounded-xl text-center"><div class="text-">🟡 ปานกลาง</div><div id="countYellow" class="font-bold text-xl">0</div></div><div class="bg-emerald-50 border p-3 rounded-xl text-center"><div class="text-">🟢 เล็กน้อย</div><div id="countGreen" class="font-bold text-xl">0</div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="md:col-span-2 bg-white rounded-2xl border overflow-hidden"><div class="p-3 bg-slate-50 border-b font-bold text-sm">📍 แผนที่ Realtime</div><div id="map"></div></div><div class="bg-white rounded-2xl border flex flex-col h-"><div class="p-3 border-b font-bold text-sm">📋 รายการเคส - กดได้ทุกปุ่ม</div><div id="caseList" class="flex-1 overflow-y-auto p-2 space-y-2"></div></div></div><div class="bg-white rounded-2xl border mt-3 p-3"><h3 class="font-bold text-sm">📜 Log ถาวร - กดได้ทุกปุ่ม</h3><div class="overflow-auto max-h-96"><table class="w-full text-"><thead class="bg-slate-100 sticky top-0"><tr><th>เวลา พ.ศ.</th><th>รหัส</th><th>ชื่อ</th><th>เบอร์</th><th>AI</th><th>📍 GPS กดได้ 100%</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="logTable"></tbody></table></div></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs", authDomain: "hatyai-rescue.firebaseapp.com", projectId: "hatyai-rescue", storageBucket: "hatyai-rescue.firebasestorage.app", messagingSenderId: "489517472133", appId: "1:489517472133:web:bf6769bbd62f312cbd0cec" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
let map=null,markers=null,cases=[],audioEl=null;
function getAudio(){ if(!audioEl){ audioEl=document.createElement('audio'); audioEl.src='https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a650f6.mp3'; audioEl.loop=true; document.body.appendChild(audioEl);} return audioEl; }
window.stopSiren=()=>{ try{getAudio().pause();}catch(e){} document.getElementById('sirenBanner').classList.add('hidden'); };
window.testSiren=()=>{ const a=getAudio(); a.play().then(()=>{ document.getElementById('sirenId').innerText='ทดสอบเสียง'; document.getElementById('sirenBanner').classList.remove('hidden'); setTimeout(stopSiren,3000); }).catch(()=>alert('กดที่หน้าจอ 1 ครั้งก่อน')); };
window.login=async()=>{ try{ await signInWithEmailAndPassword(auth, email.value, password.value); }catch(e){ alert(e.message); } };
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{ if(u){ loginBox.classList.add('hidden'); mainContent.classList.remove('hidden'); if(!map){ map=L.map('map').setView([7.008,100.4747],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); markers=L.layerGroup().addTo(map);} listen(); }else{ loginBox.classList.remove('hidden'); mainContent.classList.add('hidden'); } });
function listen(){ const q=query(collection(db,'cases'), orderBy('createdAt','desc')); onSnapshot(q,s=>{ cases=s.docs.map(d=>({fid:d.id,...d.data()})); render(); }); }
function isTest(c){ const p=(c.phone||'').toString(); return p.startsWith('074')||p.startsWith('080365')||(c.name||'').length<=2; }
function render(){ countAll.innerText=cases.length; countRed.innerText=cases.filter(c=>c.priority===3).length; countYellow.innerText=cases.filter(c=>c.priority===2).length; countGreen.innerText=cases.filter(c=>c.priority===1).length; if(markers) markers.clearLayers(); caseList.innerHTML=''; logTable.innerHTML=''; cases.forEach(c=>{ if(c.lat&&c.lng&&markers) L.circleMarker([c.lat,c.lng],{radius:12,color:c.priority===3?'red':'green',fillOpacity:0.8}).addTo(markers).bindPopup(c.name); const lat=c.lat!=null?Number(c.lat).toFixed(7):'-'; const lng=c.lng!=null?Number(c.lng).toFixed(7):'-'; const gmaps=`https://maps.google.com/?q=${c.lat},${c.lng}`; const gdir=`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`; const gps=`<div class="bg-blue-50 border-2 border-blue-300 rounded-xl p-2 mt-2"><div class="font-bold text- text-blue-800">📍 ${lat}, ${lng}</div><div class="grid grid-cols-3 gap-1 mt-2"><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white text-center py-2.5 rounded-xl font-bold text- block">🗺️ แผนที่</a><a href="${gdir}" target="_blank" class="bg-green-600 text-white text-center py-2.5 rounded-xl font-bold text- block">🚗 นำทาง</a><button type="button" onclick="copyGPS('${c.lat}','${c.lng}')" class="bg-slate-200 py-2.5 rounded-xl font-bold text-">📋 ก็อป</button></div></div>`; const card=document.createElement('div'); card.className='p-2 border rounded-xl text-xs bg-slate-50'; card.innerHTML=`<b>${c.name}</b> ${c.phone}<br>${(c.detail||'').slice(0,120)}${c.lat?gps:''}<div class="flex flex-wrap gap-1 mt-2"><button type="button" onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-3 py-2 rounded-full font-bold text-">🚤 เข้าช่วยเหลือ</button><button type="button" onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="bg-emerald-600 text-white px-3 py-2 rounded-full font-bold text-">✅ เสร็จแล้ว</button><button type="button" onclick="focusMap(${c.lat||0},${c.lng||0})" class="bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-">🔍 ซูม</button><button type="button" onclick="deleteCase('${c.fid}')" class="ml-auto bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold text-">🗑️ ลบ</button></div>`; caseList.appendChild(card); const tr=document.createElement('tr'); tr.innerHTML=`<td class="p-1 text-">${c.logTime||''}</td><td class="font-mono text-">${c.id||c.fid}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.ai?.label||''}</td><td class="p-2"><div class="font-mono text- text-blue-700">${lat}<br>${lng}</div><div class="flex flex-col gap-1 mt-1"><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white text-center px-2 py-1.5 rounded-lg font-bold text- block">🗺️ ดูแผนที่</a><a href="${gdir}" target="_blank" class="bg-green-600 text-white text-center px-2 py-1.5 rounded-lg font-bold text- block">🚗 นำทาง</a><button type="button" onclick="copyGPS('${c.lat}','${c.lng}')" class="bg-slate-200 px-2 py-1.5 rounded-lg font-bold text-">📋 ก็อปพิกัด</button></div></td><td class="max-w- truncate text-">${c.detail||''}</td><td><div class="flex flex-col gap-1"><button type="button" onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-2 py-1 rounded text-">🚤 เข้าช่วยเหลือ</button><button type="button" onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="bg-emerald-600 text-white px-2 py-1 rounded text-">✅ เสร็จ</button><button type="button" onclick="deleteCase('${c.fid}')" class="bg-red-600 text-white px-2 py-0.5 rounded text-">ลบ</button></div></td>`; logTable.appendChild(tr); }); }
window.copyGPS=(la,ln)=>{ const t=la+','+ln; navigator.clipboard.writeText(t).then(()=>alert('ก็อปแล้ว: '+t)).catch(()=>{ prompt('ก็อปพิกัด:',t); }); };
window.focusMap=(la,ln)=>{ if(map&&la&&ln) map.setView([la,ln],16); };
window.updateStatus=async(fid,s)=>{ await updateDoc(doc(db,'cases',fid),{status:s, updatedAt:new Date()}); };
window.deleteCase=async(fid)=>{ if(!confirm('ลบ? '+fid)) return; await deleteDoc(doc(db,'cases',fid)); };
window.deleteTestCases=async()=>{ const t=cases.filter(c=>{ const p=(c.phone||'').toString(); return p.startsWith('074')||p.startsWith('080365')||(c.name||'').length<=2; }); if(!t.length) return alert('ไม่พบ'); if(confirm('ลบ '+t.length+' เคส?')) for(const c of t) await deleteDoc(doc(db,'cases',c.fid)); };
window.deleteAllCases=async()=>{ if(!confirm('ลบทั้งหมด '+cases.length+'?')) return; for(const c of cases) await deleteDoc(doc(db,'cases',c.fid)); };
</script></body></html>
