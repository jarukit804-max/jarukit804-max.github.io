<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ศูนย์บัญชาการ FIXED V4 | Hatyai Rescue</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font-family:'Prompt',sans-serif}#map{height:420px}@keyframes flash{0%,100%{background:#991b1b}50%{background:#ef4444}}.flash{animation:flash 0.5s infinite}</style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="sirenBanner" class="hidden fixed top-0 left-0 right-0 z-50 flash text-white p-4 flex justify-between items-center"><div><b>🚨 เคสใหม่! </b><span id="sirenId"></span> <span id="sirenAI"></span><div id="sirenDetail" class="text-xs"></div></div><button onclick="stopSiren()" class="bg-white text-red-700 px-3 py-1 rounded-full text-xs">หยุด</button></div>

<header class="bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40">
<div><h1 class="font-bold text-sm">🛡️ ศูนย์บัญชาการ FIXED V4</h1><p class="text-[10px] text-slate-400">แก้บั๊ก orderBy - เชื่อมต่อทันที</p><p id="connStatus" class="text-[10px] text-amber-300">⏳ เชื่อมต่อ...</p></div>
<div class="flex gap-2"><button onclick="testSiren()" class="bg-white text-slate-900 px-3 py-1 rounded-full text-[10px]">🔊 ทดสอบไซเรน</button><button onclick="createTestCase()" class="bg-amber-500 px-3 py-1 rounded-full text-[10px]">+ เคสทดสอบ</button><button onclick="logout()" class="bg-slate-700 px-3 py-1 rounded-full text-[10px]">ออก</button></div>
</header>

<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-2xl shadow">
<h2 class="font-bold text-center">🔐 เจ้าหน้าที่เข้าสู่ระบบ</h2>
<input id="email" type="email" placeholder="อีเมล" class="w-full mt-3 p-3 border rounded-xl" value="hatyai.rescue1163@gmail.com">
<input id="password" type="password" placeholder="รหัสผ่าน" class="w-full mt-2 p-3 border rounded-xl">
<button onclick="login()" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-xl">เข้าสู่ระบบ</button>
<p id="loginError" class="text-[11px] text-red-600 mt-2 text-center"></p>
</div>

<main id="mainContent" class="hidden max-w-6xl mx-auto p-3">
<div class="bg-yellow-50 border border-yellow-300 rounded-xl p-3 mb-3 text-[11px]">
<div><b>🔧 Debug FIXED V4:</b> <span id="debugText">กำลังเชื่อมต่อแบบไม่ใช้ orderBy...</span></div>
<div class="mt-1">เคส: <span id="debugCount">0</span> | Auth: <span id="debugAuth">-</span> | เวลา: <span id="debugTime">-</span></div>
<div id="rawError" class="mt-2 bg-white p-2 rounded border text-[10px] text-red-600 hidden"></div>
</div>

<div class="grid grid-cols-4 gap-2 mb-3">
<div class="bg-white p-3 rounded-xl text-center border"><div class="text-[10px]">ทั้งหมด</div><div id="countAll" class="font-bold text-xl">0</div></div>
<div class="bg-red-50 border p-3 rounded-xl text-center"><div class="text-[10px] text-red-600">🔴 วิกฤต</div><div id="countRed" class="font-bold text-xl text-red-600">0</div></div>
<div class="bg-amber-50 border p-3 rounded-xl text-center"><div class="text-[10px]">🟡 ปานกลาง</div><div id="countYellow" class="font-bold text-xl">0</div></div>
<div class="bg-emerald-50 border p-3 rounded-xl text-center"><div class="text-[10px]">🟢 เล็กน้อย</div><div id="countGreen" class="font-bold text-xl">0</div></div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-3">
<div class="md:col-span-2 bg-white rounded-2xl border overflow-hidden"><div class="p-3 bg-slate-50 border-b font-bold text-sm flex justify-between"><span>📍 แผนที่เคส Realtime</span><button onclick="stopSiren()" class="bg-red-600 text-white px-2 py-1 rounded-full text-[10px]">หยุดไซเรน</button></div><div id="map"></div></div>
<div class="bg-white rounded-2xl border flex flex-col h-[460px]"><div class="p-3 border-b font-bold text-sm flex justify-between"><span>📋 รายการเคส</span><span id="liveDot" class="text-[10px] bg-emerald-100 px-2 py-0.5 rounded-full">● LIVE</span></div><div id="caseList" class="flex-1 overflow-y-auto p-2 space-y-2"></div></div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs",
  authDomain: "hatyai-rescue.firebaseapp.com",
  projectId: "hatyai-rescue",
  storageBucket: "hatyai-rescue.firebasestorage.app",
  messagingSenderId: "489517472133",
  appId: "1:489517472133:web:bf6769bbd62f312cbd0cec"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let map=null,markers=null,audioCtx=null,osc=null,gain=null,interval=null,cases=[],firstLoad=true;
let lastIds=new Set();

function initAudio(){ try{ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function playSiren(critical){
  try{
    initAudio(); stopSiren();
    gain=audioCtx.createGain(); gain.gain.value=0.9; gain.connect(audioCtx.destination);
    osc=audioCtx.createOscillator(); osc.type='sawtooth'; osc.connect(gain); osc.start();
    let f=600,dir=1; interval=setInterval(()=>{ f+=dir*(critical?130:70); if(f>1600){f=1600;dir=-1;} if(f<500){f=500;dir=1;} try{osc.frequency.value=f;}catch(e){} },40);
    document.getElementById('sirenBanner').classList.remove('hidden');
    if(navigator.vibrate) navigator.vibrate([600,200,600,200,600]);
    setTimeout(stopSiren,20000);
  }catch(e){ document.getElementById('sirenBanner').classList.remove('hidden'); }
}
window.stopSiren=()=>{ if(interval) clearInterval(interval); try{osc&&osc.stop();}catch(e){} document.getElementById('sirenBanner').classList.add('hidden'); };
window.testSiren=()=>{ document.getElementById('sirenId').innerText='TEST'; document.getElementById('sirenAI').innerText='🔴 ทดสอบ'; document.getElementById('sirenDetail').innerText='ถ้าดังแสดงว่าใช้งานได้'; playSiren(true); };

window.createTestCase=async()=>{
  try{
    const now=Date.now();
    const docData={ id:'TEST-'+now.toString().slice(-4), name:'ทดสอบระบบ', phone:'0812345678', detail:'ทดสอบ หมดสติ จมน้ำ - ทดสอบไซเรน', ai:{label:'แดง - วิกฤต', triage:'🔴', level:3}, priority:3, lat:7.008+(Math.random()-0.5)*0.05, lng:100.4747+(Math.random()-0.5)*0.05, status:'รอช่วยเหลือ', timestamp:now, logTime:new Date().toLocaleString('th-TH'), createdAt:serverTimestamp() };
    const r=await addDoc(collection(db,'cases'), docData);
    alert('✅ สร้างเคสทดสอบ: '+r.id);
  }catch(e){ alert('สร้างไม่สำเร็จ: '+e.message); }
};

window.login=async()=>{
  try{ await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); }catch(e){ document.getElementById('loginError').innerText=e.message; }
};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  document.getElementById('debugAuth').innerText=user?user.email+' ✅':'ยังไม่ Login ❌';
  if(user){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    document.getElementById('connStatus').innerText='🟢 '+user.email;
    initMap();
    listenCasesFIXED();
  }else{
    document.getElementById('loginBox').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
  }
});

function initMap(){
  if(map) return;
  map=L.map('map').setView([7.008,100.4747],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  markers=L.layerGroup().addTo(map);
  setTimeout(()=>map.invalidateSize(),500);
}

function listenCasesFIXED(){
  const debugText=document.getElementById('debugText');
  const rawError=document.getElementById('rawError');
  debugText.innerText='กำลังเชื่อมต่อ Firestore แบบไม่ใช้ orderBy (FIXED V4)...';
  
  // FIXED: ไม่ใช้ orderBy เลย ใช้ collection เปล่าๆ
  const colRef = collection(db,'cases');
  
  onSnapshot(colRef, (snap)=>{
    const prevCount=cases.length;
    // เรียงเองใน JS ไม่พึ่ง Firestore Index
    cases=snap.docs.map(d=>({fid:d.id, ...d.data()})).sort((a,b)=>(b.timestamp||b.createdAtLocal||0)-(a.timestamp||a.createdAtLocal||0));
    
    debugText.innerText='✅ เชื่อมต่อสำเร็จ! พบ '+cases.length+' เคส | อัปเดต: '+new Date().toLocaleTimeString('th-TH');
    document.getElementById('debugCount').innerText=cases.length;
    document.getElementById('debugTime').innerText=new Date().toLocaleTimeString();
    document.getElementById('connStatus').innerText='🟢 LIVE - '+cases.length+' เคส';
    rawError.classList.add('hidden');
    
    if(!firstLoad && cases.length>prevCount){
      const newOnes=cases.filter(c=>!lastIds.has(c.fid));
      if(newOnes.length>0){
        const n=newOnes[0];
        document.getElementById('sirenId').innerText=n.id||'';
        document.getElementById('sirenAI').innerText=(n.ai?.triage||'🚨')+' '+(n.ai?.label||'');
        document.getElementById('sirenDetail').innerText=(n.detail||'').slice(0,100);
        playSiren(n.priority===3);
      }
    }
    firstLoad=false;
    lastIds=new Set(cases.map(c=>c.fid));
    render();
  }, (err)=>{
    debugText.innerText='❌ Error: '+err.code;
    rawError.innerText=err.code+' - '+err.message;
    rawError.classList.remove('hidden');
    console.error(err);
  });
}

function render(){
  document.getElementById('countAll').innerText=cases.length;
  document.getElementById('countRed').innerText=cases.filter(c=>c.priority===3).length;
  document.getElementById('countYellow').innerText=cases.filter(c=>c.priority===2).length;
  document.getElementById('countGreen').innerText=cases.filter(c=>c.priority===1).length;
  if(markers) markers.clearLayers();
  const list=document.getElementById('caseList');
  if(!list) return;
  list.innerHTML='';
  if(cases.length===0){ list.innerHTML='<p class="text-xs text-center py-10 text-slate-400">ยังไม่มีเคส<br>กด + เคสทดสอบ</p>'; return; }
  cases.forEach(c=>{
    const color=c.priority===3?'red':c.priority===2?'orange':'green';
    if(map && markers && c.lat && c.lng) L.circleMarker([c.lat,c.lng],{radius:c.priority===3?14:10,color,fillOpacity:0.8}).addTo(markers).bindPopup(`<b>${c.name}</b><br>${c.phone}<br>${c.detail}`);
    const card=document.createElement('div'); card.className='p-2 border rounded-xl bg-slate-50 text-xs';
    card.innerHTML=`<div class="flex justify-between"><b>${c.name||'-'}</b><span class="text-[10px] px-2 py-0.5 rounded-full ${c.priority===3?'bg-red-100 text-red-700':'bg-slate-100'}">${c.ai?.triage||''} ${c.ai?.label||''}</span></div><div>📞 ${c.phone} | ${c.logTime||''}</div><div class="bg-white p-1 rounded border mt-1">${(c.detail||'').slice(0,120)}</div><div class="flex gap-2 mt-2"><button onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="text-amber-600">🚤 ไปช่วย</button><button onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="text-emerald-600">✅ เสร็จ</button></div>`;
    list.appendChild(card);
  });
}
window.updateStatus=async(fid,status)=>{ try{ await updateDoc(doc(db,'cases',fid),{status}); }catch(e){ alert(e.message); } };
document.addEventListener('click',()=>{initAudio();},{once:true});
</script>
</body>
</html>
