<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FINAL V12 - เสียงดัง + บันทึกออนไลน์ 100%</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:420px}button{cursor:pointer}</style></head><body class="bg-slate-100 min-h-screen">
<div id="sirenBanner" class="hidden fixed top-0 left-0 right-0 z-[70] bg-red-600 text-white p-4 flex justify-between items-center"><div><b>🚨 เคสใหม่เข้า! </b><span id="sirenId"></span> <span id="sirenAI"></span><div id="sirenDetail" class="text-xs"></div></div><button onclick="stopSiren()" class="bg-white text-red-700 px-4 py-2 rounded-full font-bold">🔇 หยุดเสียง</button></div>
<header class="bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40"><div><h1 class="font-bold text-sm">🛡️ FINAL V12 - เสียงดัง + บันทึกออนไลน์</h1></div><div class="flex gap-1"><button id="soundBtn" type="button" onclick="enableSound()" class="bg-yellow-400 text-black px-4 py-2 rounded-full text- font-black">🔊 กดเพื่อเปิดเสียงดังลั่น</button><button type="button" onclick="logout()" class="bg-slate-700 px-3 py-1.5 rounded-full text-">ออก</button></div></header>
<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-2xl shadow"><h2 class="font-bold text-center">🔐 เข้าสู่ระบบ</h2><input id="email" placeholder="อีเมล" class="w-full mt-3 p-3 border rounded-xl"><input id="password" type="password" placeholder="รหัสผ่าน" class="w-full mt-2 p-3 border rounded-xl"><button type="button" onclick="login()" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-xl font-bold">เข้าสู่ระบบ</button><p id="loginMsg" class="text- text-center mt-2 text-red-500"></p></div>
<main id="mainContent" class="hidden max-w-6xl mx-auto p-3"><div class="bg-blue-50 border-2 border-blue-300 rounded-xl p-3 mb-3 flex justify-between items-center"><div><div class="font-bold text- text-blue-900">📅 บันทึกเคสออนไลน์: <span id="onlineClock" class="text-blue-700">-</span></div><div class="text- mt-1"><span id="soundStatus" class="font-bold text-red-600">🔇 เสียงปิดอยู่ - กดปุ่มเหลือง 🔊 ด้านบน 1 ครั้ง</span> | <span id="debug" class="text-slate-600">พร้อม</span></div></div><button type="button" onclick="testSiren()" class="bg-red-600 text-white px-4 py-2 rounded-full text- font-bold">🔊 เทสไซเรนดังลั่น</button></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="md:col-span-2 bg-white rounded-2xl border overflow-hidden"><div id="map"></div></div><div class="bg-white rounded-2xl border h- overflow-y-auto"><div id="caseList" class="p-2 space-y-2"></div></div></div><div class="bg-white rounded-2xl border mt-3 p-3"><h3 class="font-bold text-sm">📜 Log ถาวร - บันทึกเคสออนไลน์ + เวลา พ.ศ. + GPS 3 ปุ่ม + เสียงดัง + ปุ่มกดได้ 100%</h3><div class="overflow-auto max-h- mt-2"><table class="w-full text-"><thead class="bg-slate-100 sticky top-0"><tr><th class="p-2">เวลา พ.ศ. / ออนไลน์</th><th>รหัส</th><th>ชื่อ</th><th>เบอร์</th><th>AI</th><th>📍 GPS กดได้</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="logTable"></tbody></table></div></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs", authDomain: "hatyai-rescue.firebaseapp.com", projectId: "hatyai-rescue", storageBucket: "hatyai-rescue.firebasestorage.app", messagingSenderId: "489517472133", appId: "1:489517472133:web:bf6769bbd62f312cbd0cec" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
let map=null,markers=null,cases=[],audioCtx=null,masterGain=null,osc1=null,sirenInterval=null,soundEnabled=false,seenIds=new Set(),firstLoad=true;
function updateClock(){ const now=new Date(); const be=now.getFullYear()+543; document.getElementById('onlineClock').innerText=`${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH')} (พ.ศ. ${be}) ออนไลน์`; } setInterval(updateClock,1000); updateClock();
function initAudio(){ if(!audioCtx){ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); masterGain=audioCtx.createGain(); masterGain.gain.value=1.0; masterGain.connect(audioCtx.destination); } if(audioCtx.state==='suspended') audioCtx.resume(); const saved=localStorage.getItem('hatyai_sound_enabled'); if(saved==='true'){ soundEnabled=true; updateSoundUI(true); } }
function updateSoundUI(on){ const btn=document.getElementById('soundBtn'); const st=document.getElementById('soundStatus'); if(on){ btn.innerText='✅ เสียงเปิดดังลั่นแล้ว'; btn.className='bg-emerald-500 text-white px-4 py-2 rounded-full text- font-bold'; st.innerText='🔊 เสียงเปิดแล้ว - พร้อมดัง'; st.className='font-bold text-emerald-600'; }else{ btn.innerText='🔊 กดเพื่อเปิดเสียงดังลั่น'; btn.className='bg-yellow-400 text-black px-4 py-2 rounded-full text- font-black animate-pulse'; st.innerText='🔇 เสียงปิดอยู่ - กดปุ่มเหลือง 🔊 ด้านบน 1 ครั้ง'; st.className='font-bold text-red-600'; } }
window.enableSound=()=>{ initAudio(); soundEnabled=true; localStorage.setItem('hatyai_sound_enabled','true'); updateSoundUI(true); playLoudSiren(true,1200); setTimeout(stopSiren,1200); };
function playLoudSiren(isCritical,dur){ if(!soundEnabled) return; initAudio(); stopSiren(); try{ osc1=audioCtx.createOscillator(); osc1.type='sawtooth'; osc1.frequency.value=800; const gain=audioCtx.createGain(); gain.gain.value=0.9; osc1.connect(gain); gain.connect(masterGain); osc1.start(); let high=true; const d=dur||(isCritical?25000:15000); sirenInterval=setInterval(()=>{ high=!high; try{ osc1.frequency.value=high?(isCritical?1200:900):600; }catch(e){} }, 150); if(d>0) setTimeout(stopSiren,d); }catch(e){} }
window.testSiren=()=>{ if(!soundEnabled){ enableSound(); return; } document.getElementById('sirenBanner').classList.remove('hidden'); document.getElementById('sirenId').innerText='ทดสอบเสียง V12 ดังลั่น'; playLoudSiren(true,5000); };
window.stopSiren=()=>{ if(sirenInterval) clearInterval(sirenInterval); try{ osc1&&osc1.stop(); }catch(e){} document.getElementById('sirenBanner').classList.add('hidden'); };
window.login=async()=>{ try{ await signInWithEmailAndPassword(auth, email.value, password.value); }catch(e){ loginMsg.innerText=e.message; } }; window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{ if(u){ loginBox.classList.add('hidden'); mainContent.classList.remove('hidden'); if(!map){ map=L.map('map').setView([7.008,100.4747],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); markers=L.layerGroup().addTo(map); } initAudio(); listen(); }else{ loginBox.classList.remove('hidden'); mainContent.classList.add('hidden'); } });
window.updateStatus=async(fid,newStatus)=>{ document.getElementById('debug').innerText='⏳ '+fid+' -> '+newStatus; try{ await updateDoc(doc(db,'cases',fid),{status:newStatus, updatedAt:serverTimestamp()}); document.getElementById('debug').innerText='✅ '+newStatus+' แล้ว'; }catch(e){ document.getElementById('debug').innerText='❌ '+e.message; alert('กดไม่ได้: '+e.message); const c=cases.find(x=>x.fid===fid); if(c){ c.status=newStatus; render(); } } };
window.deleteCase=async(fid)=>{ if(!confirm('ลบ? '+fid)) return; try{ await deleteDoc(doc(db,'cases',fid)); }catch(e){ alert(e.message); } };
function listen(){ const q=query(collection(db,'cases'), orderBy('createdAt','desc')); onSnapshot(q,s=>{ const arr=s.docs.map(d=>({fid:d.id,...d.data()})); const newOnes=arr.filter(c=>!seenIds.has(c.fid)); if(!firstLoad && newOnes.length>0){ const n=newOnes[0]; document.getElementById('sirenId').innerText=n.id||n.fid; document.getElementById('sirenDetail').innerText=(n.detail||'').slice(0,100)+' | '+ (n.logTime||'')+' | ออนไลน์ '+ (n.onlineDateTime||''); if(soundEnabled){ document.getElementById('sirenBanner').classList.remove('hidden'); playLoudSiren(n.priority===3); } else{ document.getElementById('sirenBanner').classList.remove('hidden'); setTimeout(()=>document.getElementById('sirenBanner').classList.add('hidden'),8000); } } arr.forEach(c=>seenIds.add(c.fid)); firstLoad=false; cases=arr; render(); }); }
function render(){ document.getElementById('countAll').innerText=cases.length; if(markers) markers.clearLayers(); caseList.innerHTML=''; logTable.innerHTML=''; cases.forEach(c=>{ if(c.lat&&c.lng&&markers) L.circleMarker([c.lat,c.lng],{radius:10,color:c.priority===3?'red':'green',fillOpacity:0.8}).addTo(markers).bindPopup(`<b>${c.name}</b><br>${c.status||''}<br>${c.logTime||''}`); const gmaps=`https://maps.google.com/?q=${c.lat},${c.lng}`; const gdir=`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`; const statusColor=c.status==='กำลังไปช่วย'?'bg-amber-100 text-amber-800':c.status==='เสร็จแล้ว'?'bg-emerald-100 text-emerald-800':'bg-red-50 text-red-700'; const gps=`<div class="bg-blue-50 border-2 border-blue-300 rounded-xl p-2 mt-2"><div class="font-bold text- text-blue-800">📍 ${c.lat},${c.lng}</div><div class="text-">📅 ${c.logTime||''} | 💾 ${c.onlineDateTime||''}</div><div class="grid grid-cols-3 gap-1 mt-2"><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white text-center py-2 rounded-xl font-bold text- block">🗺️ แผนที่</a><a href="${gdir}" target="_blank" class="bg-green-600 text-white text-center py-2 rounded-xl font-bold text- block">🚗 นำทาง</a><button type="button" onclick="copyGPS('${c.lat}','${c.lng}')" class="bg-slate-200 py-2 rounded-xl font-bold text-">📋 ก็อป</button></div></div>`; const tr=document.createElement('tr'); tr.className='border-b'; tr.innerHTML=`<td class="p-1 text-">${c.logTime||''}<br><span class="text- text-blue-600 font-bold">${c.onlineDateTime||''}</span><br><span class="text- px-1 rounded border ${statusColor}">${c.status||'รอช่วยเหลือ'}</span></td><td class="font-mono text-">${c.id||c.fid.slice(-6)}</td><td class="font-bold">${c.name}</td><td>${c.phone}</td><td class="text-">${c.ai?.label||''}</td><td class="p-1"><div class="font-mono text- text-blue-700">${c.lat},${c.lng}</div><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white px-2 py-1 rounded text- block text-center">🗺️ แผนที่</a></td><td class="max-w- truncate text-">${c.detail||''}</td><td><div class="flex flex-col gap-1 w-"><button type="button" onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-2 py-2 rounded-full font-bold text-">🚤 กำลังไปช่วย</button><button type="button" onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="bg-emerald-600 text-white px-2 py-2 rounded-full font-bold text-">✅ เสร็จภารกิจ</button></div></td>`; logTable.appendChild(tr); const card=document.createElement('div'); card.className='p-2 border-2 rounded-xl text-xs bg-slate-50'; card.innerHTML=`<div class="flex justify-between"><b>${c.name}</b><span class="text- px-2 py-0.5 rounded-full border ${statusColor}">${c.status||'รอช่วยเหลือ'}</span></div><div>${c.detail||''}</div>${c.lat?gps:''}<div class="flex gap-1 mt-2"><button type="button" onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="flex-1 bg-amber-500 text-white py-2 rounded-full font-bold text-">🚤 กำลังไปช่วย</button><button type="button" onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="flex-1 bg-emerald-600 text-white py-2 rounded-full font-bold text-">✅ เสร็จแล้ว</button></div>`; caseList.appendChild(card); }); }
window.copyGPS=(la,ln)=>{ navigator.clipboard.writeText(la+','+ln); };
</script></body></html>
