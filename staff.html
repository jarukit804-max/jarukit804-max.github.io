<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FINAL V9 - บันทึกออนไลน์ + เสียงเตือนดัง</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:420px}</style></head><body class="bg-slate-100 min-h-screen">
<div id="sirenBanner" class="hidden fixed top-0 left-0 right-0 z-[60] bg-red-700 text-white p-3 flex justify-between items-center animate-pulse"><div><b>🚨 เคสใหม่! </b><span id="sirenId"></span> <span id="sirenAI"></span><div id="sirenDetail" class="text-xs"></div></div><button onclick="stopSiren()" class="bg-white text-red-700 px-3 py-1 rounded-full text-xs font-bold">หยุดเสียง</button></div>
<header class="bg-slate-900 text-white p-3 flex justify-between items-center sticky top-0 z-40"><div><h1 class="font-bold text-sm">🛡️ FINAL V9 - บันทึกออนไลน์ + เสียงดัง</h1><p class="text- text-emerald-300">✅ Log ออนไลน์ + ไซเรนดัง + GPS 3 ปุ่ม</p></div><div class="flex gap-1 items-center"><button type="button" id="soundBtn" onclick="enableSound()" class="bg-yellow-400 text-black px-3 py-1.5 rounded-full text- font-bold animate-pulse">🔊 เปิดเสียงไซเรน</button><button type="button" onclick="deleteTestCases()" class="bg-orange-500 text-white px-2 py-1.5 rounded-full text- font-bold">🗑️ ลบทดสอบ</button><button type="button" onclick="logout()" class="bg-slate-700 px-2 py-1 rounded-full text-">ออก</button></div></header>
<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-2xl shadow"><input id="email" placeholder="อีเมล" class="w-full mt-3 p-3 border rounded-xl"><input id="password" type="password" placeholder="รหัสผ่าน" class="w-full mt-2 p-3 border rounded-xl"><button type="button" onclick="login()" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-xl font-bold">เข้าสู่ระบบ</button></div>
<main id="mainContent" class="hidden max-w-6xl mx-auto p-3"><div class="bg-blue-50 border rounded-xl p-2 mb-3 flex justify-between items-center"><div class="text-"><b>📅 บันทึกเคสออนไลน์:</b> <span id="onlineClock" class="font-bold text-blue-700">-</span> | <span id="soundStatus" class="text-red-600 font-bold">🔇 เสียงปิดอยู่ - กดปุ่มเหลืองด้านบน</span></div><button onclick="testSiren()" class="bg-red-600 text-white px-3 py-1 rounded-full text- font-bold">🔊 เทสไซเรน</button></div><div class="grid grid-cols-4 gap-2 mb-3"><div class="bg-white p-3 rounded-xl text-center"><div id="countAll" class="font-bold text-xl">0</div></div><div class="bg-red-50 p-3 rounded-xl text-center"><div id="countRed" class="font-bold text-xl text-red-600">0</div></div><div class="bg-amber-50 p-3 rounded-xl text-center"><div id="countYellow" class="font-bold text-xl">0</div></div><div class="bg-emerald-50 p-3 rounded-xl text-center"><div id="countGreen" class="font-bold text-xl">0</div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="md:col-span-2 bg-white rounded-2xl border overflow-hidden"><div id="map"></div></div><div class="bg-white rounded-2xl border h- overflow-y-auto"><div id="caseList" class="p-2 space-y-2"></div></div></div><div class="bg-white rounded-2xl border mt-3 p-3"><h3 class="font-bold text-sm">📜 Log ถาวร - บันทึกเคสออนไลน์ + เวลา พ.ศ. + GPS 3 ปุ่ม</h3><div class="overflow-auto max-h-"><table class="w-full text-"><thead class="bg-slate-100 sticky top-0"><tr><th class="p-2">เวลา พ.ศ. / ออนไลน์</th><th>รหัส</th><th>ชื่อ</th><th>เบอร์</th><th>AI</th><th>📍 GPS กดได้</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="logTable"></tbody></table></div><button onclick="exportCSV()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-full text- font-bold mt-2">📥 Export CSV บันทึกออนไลน์</button></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs", authDomain: "hatyai-rescue.firebaseapp.com", projectId: "hatyai-rescue", storageBucket: "hatyai-rescue.firebasestorage.app", messagingSenderId: "489517472133", appId: "1:489517472133:web:bf6769bbd62f312cbd0cec" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
let map=null,markers=null,cases=[],audioEl=null,soundEnabled=false,seenIds=new Set(),firstLoad=true;
function updateClock(){ const now=new Date(); const be=now.getFullYear()+543; document.getElementById('onlineClock').innerText=`${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH')} (พ.ศ. ${be})`; } setInterval(updateClock,1000); updateClock();
function getAudio(){ if(!audioEl){ audioEl=document.createElement('audio'); audioEl.src='https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a650f6.mp3'; audioEl.loop=true; document.body.appendChild(audioEl);} return audioEl; }
window.enableSound=()=>{ soundEnabled=true; getAudio().play().then(()=>{ document.getElementById('soundStatus').innerText='🔊 เสียงเปิดแล้ว'; document.getElementById('soundBtn').innerText='✅ เสียงเปิดแล้ว'; setTimeout(()=>getAudio().pause(),800); }).catch(()=>alert('กดที่จออีกครั้ง')); };
window.testSiren=()=>{ if(!soundEnabled){ alert('กดเปิดเสียงก่อน'); return; } document.getElementById('sirenBanner').classList.remove('hidden'); getAudio().play(); setTimeout(()=>{ getAudio().pause(); document.getElementById('sirenBanner').classList.add('hidden'); },5000); };
window.stopSiren=()=>{ try{getAudio().pause();}catch(e){} document.getElementById('sirenBanner').classList.add('hidden'); };
window.login=async()=>{ await signInWithEmailAndPassword(auth, email.value, password.value); }; window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{ if(u){ loginBox.classList.add('hidden'); mainContent.classList.remove('hidden'); if(!map){ map=L.map('map').setView([7.008,100.4747],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); markers=L.layerGroup().addTo(map);} listen(); }else{ loginBox.classList.remove('hidden'); mainContent.classList.add('hidden'); } });
function listen(){ onSnapshot(query(collection(db,'cases'), orderBy('createdAt','desc')), s=>{ const arr=s.docs.map(d=>({fid:d.id,...d.data()})); const newOnes=arr.filter(c=>!seenIds.has(c.fid)); if(!firstLoad && newOnes.length>0 && soundEnabled){ const n=newOnes[0]; document.getElementById('sirenId').innerText=n.id||n.fid; document.getElementById('sirenBanner').classList.remove('hidden'); getAudio().play(); } arr.forEach(c=>seenIds.add(c.fid)); firstLoad=false; cases=arr; render(); }); }
function render(){ countAll.innerText=cases.length; caseList.innerHTML=''; logTable.innerHTML=''; cases.forEach(c=>{ const gmaps=`https://maps.google.com/?q=${c.lat},${c.lng}`; const gps=`<div class="bg-blue-50 border-2 rounded-xl p-2 mt-2"><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white px-2 py-1 rounded text-">🗺️ แผนที่</a> <button onclick="navigator.clipboard.writeText('${c.lat},${c.lng}')" class="bg-slate-200 px-2 py-1 rounded text-">📋 ก็อป</button></div>`; const card=document.createElement('div'); card.innerHTML=`<b>${c.name}</b> ${c.phone}<br>${c.detail||''}${gps}<br><button onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-3 py-2 rounded-full font-bold text-">🚤 เข้าช่วยเหลือ</button>`; caseList.appendChild(card); const tr=document.createElement('tr'); tr.innerHTML=`<td class="text-">${c.logTime||''}<br><span class="text- text-blue-600">${c.onlineDateTime||''}</span></td><td>${c.id||c.fid}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.ai?.label||''}</td><td>${c.lat},${c.lng}</td><td>${c.detail||''}</td><td><button onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-2 py-1 rounded text-">🚤 เข้าช่วยเหลือ</button><button onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="bg-emerald-600 text-white px-2 py-1 rounded text-">✅ เสร็จ</button></td>`; logTable.appendChild(tr); }); }
window.updateStatus=async(fid,s)=>{ await updateDoc(doc(db,'cases',fid),{status:s}); };
window.deleteCase=async(fid)=>{ if(confirm('ลบ?')) await deleteDoc(doc(db,'cases',fid)); };
window.deleteTestCases=async()=>{ const t=cases.filter(c=> (c.phone||'').toString().startsWith('074')); for(const c of t) await deleteDoc(doc(db,'cases',c.fid)); };
window.exportCSV=()=>{ let csv='เวลา พ.ศ.,เวลาออนไลน์,รหัส,ชื่อ,เบอร์,AI,สถานะ\n'; cases.forEach(c=>{ csv+=`"${c.logTime||''}","${c.onlineDateTime||''}","${c.id||c.fid}","${c.name}","${c.phone}","${c.ai?.label||''}","${c.status||''}"\n`; }); const b=new Blob(['\uFEFF'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='online.csv'; a.click(); };
</script></body></html>
