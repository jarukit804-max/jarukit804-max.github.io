<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FINAL V8 - กดได้ 100%</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:420px}</style></head><body class="bg-slate-100 min-h-screen">
<header class="bg-slate-900 text-white p-3 flex justify-between sticky top-0 z-40"><div><h1 class="font-bold text-sm">🛡️ FINAL V8 - กดได้ 100%</h1></div><div class="flex gap-2"><button onclick="deleteTestCases()" class="bg-orange-500 text-white px-3 py-1.5 rounded-full text- font-bold">🗑️ ลบทดสอบ</button><button onclick="logout()" class="bg-slate-700 px-3 py-1 rounded-full text-">ออก</button></div></header>
<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-6 rounded-2xl shadow"><input id="email" placeholder="อีเมล" class="w-full p-3 border rounded-xl"><input id="password" type="password" placeholder="รหัสผ่าน" class="w-full mt-2 p-3 border rounded-xl"><button onclick="login()" class="w-full mt-3 bg-slate-900 text-white p-3 rounded-xl font-bold">เข้าสู่ระบบ</button></div>
<main id="mainContent" class="hidden max-w-6xl mx-auto p-3"><div class="grid grid-cols-4 gap-2 mb-3"><div class="bg-white p-3 rounded-xl text-center"><div id="countAll" class="font-bold text-xl">0</div></div><div class="bg-red-50 p-3 rounded-xl text-center"><div id="countRed" class="font-bold text-xl text-red-600">0</div></div><div class="bg-amber-50 p-3 rounded-xl text-center"><div id="countYellow" class="font-bold text-xl">0</div></div><div class="bg-emerald-50 p-3 rounded-xl text-center"><div id="countGreen" class="font-bold text-xl">0</div></div></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><div class="md:col-span-2 bg-white rounded-2xl border overflow-hidden"><div id="map"></div></div><div class="bg-white rounded-2xl border h- overflow-y-auto"><div id="caseList" class="p-2 space-y-2"></div></div></div><div class="bg-white rounded-2xl border mt-3 p-3"><table class="w-full text-"><tbody id="logTable"></tbody></table></div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs", authDomain: "hatyai-rescue.firebaseapp.com", projectId: "hatyai-rescue", storageBucket: "hatyai-rescue.firebasestorage.app", messagingSenderId: "489517472133", appId: "1:489517472133:web:bf6769bbd62f312cbd0cec" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
let map=null,markers=null,cases=[];
window.login=async()=>{ await signInWithEmailAndPassword(auth, email.value, password.value); };
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{ if(u){ loginBox.classList.add('hidden'); mainContent.classList.remove('hidden'); if(!map){ map=L.map('map').setView([7.008,100.4747],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); markers=L.layerGroup().addTo(map);} listen(); }else{ loginBox.classList.remove('hidden'); mainContent.classList.add('hidden'); } });
function listen(){ onSnapshot(query(collection(db,'cases'), orderBy('createdAt','desc')), s=>{ cases=s.docs.map(d=>({fid:d.id,...d.data()})); render(); }); }
function render(){ countAll.innerText=cases.length; caseList.innerHTML=''; logTable.innerHTML=''; cases.forEach(c=>{ const gmaps=`https://maps.google.com/?q=${c.lat},${c.lng}`; const gdir=`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}`; const gps=`<div class="bg-blue-50 border-2 rounded-xl p-2 mt-2"><div class="grid grid-cols-3 gap-1"><a href="${gmaps}" target="_blank" class="bg-blue-600 text-white text-center py-2 rounded-xl font-bold text- block">🗺️ แผนที่</a><a href="${gdir}" target="_blank" class="bg-green-600 text-white text-center py-2 rounded-xl font-bold text- block">🚗 นำทาง</a><button onclick="navigator.clipboard.writeText('${c.lat},${c.lng}')" class="bg-slate-200 py-2 rounded-xl font-bold text-">📋 ก็อป</button></div></div>`; const card=document.createElement('div'); card.className='p-2 border rounded-xl bg-slate-50 text-xs'; card.innerHTML=`<b>${c.name}</b> ${c.phone}<br>${c.detail||''}${gps}<br><button onclick="updateStatus('${c.fid}','กำลังไปช่วย')" class="bg-amber-500 text-white px-3 py-2 rounded-full font-bold text-">🚤 เข้าช่วยเหลือ</button><button onclick="updateStatus('${c.fid}','เสร็จแล้ว')" class="bg-emerald-600 text-white px-3 py-2 rounded-full font-bold text-">✅ เสร็จแล้ว</button>`; caseList.appendChild(card); }); }
window.updateStatus=async(fid,s)=>{ await updateDoc(doc(db,'cases',fid),{status:s}); };
window.deleteCase=async(fid)=>{ if(confirm('ลบ?')) await deleteDoc(doc(db,'cases',fid)); };
window.deleteTestCases=async()=>{ const t=cases.filter(c=> (c.phone||'').toString().startsWith('074')); for(const c of t) await deleteDoc(doc(db,'cases',c.fid)); };
</script></body></html>
