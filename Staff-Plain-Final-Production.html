<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs",
  authDomain: "hatyai-rescue.firebaseapp.com",

};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// DOM
const loginOverlay = document.getElementById('loginOverlay');
const appRoot = document.getElementById('appRoot');
const emailInput = document.getElementById('emailInput');
const passInput = document.getElementById('passInput');
const loginBtn = document.getElementById('loginBtn');
const demoBtn = document.getElementById('demoBtn');
const loginError = document.getElementById('loginError');
const searchInput = document.getElementById('searchInput');

const emptyState = document.getElementById('emptyState');
const audioUnlockBtn = document.getElementById('audioUnlockBtn');
const sirenAudio = document.getElementById('sirenAudio');
const sirenToggle = document.getElementById('sirenToggle');
const exportBtn = document.getElementById('exportBtn');
const deleteTestBtn = document.getElementById('deleteTestBtn');
const logoutBtn = document.getElementById('logoutBtn');

let audioUnlocked = false;
let sirenEnabled = false;
let map, markerLayer;
let allCasesSorted = [];
let previousTotal = 0;
let audioCtx = null;

// Login helpers - trim lowercase validation + Thai errors
function showError(msg){
  loginError.textContent = msg;
  loginError.classList.remove('hidden');
}
function clearError(){
  loginError.classList.add('hidden');
  loginError.textContent = '';
}
function validateLoginFields(){
  clearError();
  const emailRaw = emailInput.value;
  const passRaw = passInput.value;
  const email = emailRaw.trim().toLowerCase();
  const pass = passRaw.trim();
  if(!email){ showError('กรุณากรอกอีเมล'); return null; }
  if(email.indexOf('@') === -1 || email.indexOf('.') === -1){ showError('รูปแบบอีเมลไม่ถูกต้อง ตัวอย่าง: staff@hatyai-rescue.local'); return null; }
  if(!pass){ showError('กรุณากรอกรหัสผ่าน'); return null; }
  if(pass.length < 4){ showError('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'); return null; }
  return {email, pass};
}
async function doLogin(){
  const creds = validateLoginFields();
  if(!creds) return;
  loginBtn.textContent = 'กำลังตรวจสอบ...';
  loginBtn.disabled = true;
  try{
    await signInWithEmailAndPassword(auth, creds.email, creds.pass);
    enterApp();
  }catch(e){
    console.warn(e);
    const code = e && e.code ? e.code : '';
    if(code === 'auth/invalid-email') showError('อีเมลไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
    else if(code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') showError('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
    else if(code === 'auth/too-many-requests') showError('พยายามเข้าสู่ระบบบ่อยเกินไป กรุณารอสักครู่');
    else showError('เข้าสู่ระบบไม่สำเร็จ: ' + (e.message || 'เกิดข้อผิดพลาด'));
  }finally{
    loginBtn.textContent = 'เข้าสู่ระบบ';
    loginBtn.disabled = false;
  }
}
function enterApp(){
  loginOverlay.classList.add('hidden');
  appRoot.classList.remove('hidden');
  initMap();
  initListener();
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(err){}
}
loginBtn.addEventListener('click', doLogin);
passInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });
emailInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doLogin(); });
demoBtn.addEventListener('click', ()=>{ clearError(); enterApp(); });
logoutBtn.addEventListener('click', ()=>{ location.reload(); });

// Audio unlock
audioUnlockBtn.addEventListener('click', async ()=>{
  try{
    if(audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
    sirenAudio.volume = 0.001;
    await sirenAudio.play();
    sirenAudio.pause();
    sirenAudio.currentTime = 0;
    sirenAudio.volume = 0.7;
    audioUnlocked = true;
    audioUnlockBtn.textContent = '✅ เปิดเสียงแล้ว';
    audioUnlockBtn.classList.add('bg-emerald-900','border-emerald-700','text-emerald-200');
  }catch(err){
    showToast('เบราว์เซอร์บล็อกเสียง กรุณากดอีกครั้งและอนุญาตเสียง');
  }
});
sirenToggle.addEventListener('click', ()=>{
  sirenEnabled = !sirenEnabled;
  sirenToggle.textContent = sirenEnabled ? '\uD83D\uDEA8 Siren: เปิด' : '\uD83D\uDEA8 Siren: ปิด';
  if(!sirenEnabled){ sirenAudio.pause(); sirenAudio.currentTime=0; }
});

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-slate-100 text-[13px] px-4 py-2.5 rounded-xl shadow-xl z-[9998]';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 3200);
}

// Map
function initMap(){
  if(map) return;
  map = L.map('map', { zoomControl:true }).setView([7.008, 100.476, 12], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

// Helpers
function formatTime(ts){
  try{
    let d;
    if(!ts) return '-';
    if(ts.toDate) d = ts.toDate();
    else if(ts.seconds) d = new Date(ts.seconds*1000);
    else d = new Date(ts);
    return d.toLocaleString('th-TH', { year:'2-digit', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }catch(e){ return '-'; }
}
function toFixed7(v){
  const n = Number(v);
  if(isNaN(n)) return '-';
  return n.toFixed(7);
}
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getLatLng(docData){
  let lat = docData.lat;
  let lng = docData.lng;
  if(lat == null && docData.latitude != null) lat = docData.latitude;
  if(lng == null && docData.longitude != null) lng = docData.longitude;
  if(lat == null && docData.gps && docData.gps.lat) lat = docData.gps.lat;
  if(lng == null && docData.gps && docData.gps.lng) lng = docData.gps.lng;
  if(lat == null && docData.location && docData.location.lat) lat = docData.location.lat;
  if(lng == null && docData.location && docData.location.lng) lng = docData.location.lng;
  return {lat: Number(lat), lng: Number(lng)};
}

// Firestore listener - sequential CASE-0001 sort by createdAt ASC
function initListener(){
  const colRef = collection(db, 'cases');
  const q = query(colRef, orderBy('createdAt','asc'));
  onSnapshot(q, (snap)=>{
    let docs = [];
    snap.forEach(d=>{
      const data = d.data();
      docs.push({ id: d.id, ...data });
    });
    // Fallback sort ASC by createdAt
    docs.sort((a,b)=>{
      const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : (a.createdAt ? new Date(a.createdAt).getTime()/1000 : 0);
      const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : (b.createdAt ? new Date(b.createdAt).getTime()/1000 : 0);
      if(ta!==tb) return ta - tb;
      return (a.id||'').localeCompare(b.id||'');
    });
    // Assign sequential CASE-0001 padded 4 digits
    docs = docs.map((d, idx)=>{
      const num = idx + 1;
      const caseCode = 'CASE-' + String(num).padStart(4,'0');
      return { ...d, _seq: num, _caseCode: caseCode };
    });
    allCasesSorted = docs;

    // Siren on new case
    if(previousTotal && docs.length > previousTotal && audioUnlocked && sirenEnabled){
      sirenAudio.currentTime = 0;
      sirenAudio.play().catch(()=>{});
      showToast('มีเคสใหม่ ' + docs[docs.length-1]._caseCode + ' เข้ามา');
    }
    previousTotal = docs.length;

    renderDashboard(docs);
    renderMap(docs);
    renderTable(docs);
  }, (err)=>{
    console.error(err);
    tableBody.innerHTML = '<tr><td colspan="10" class="px-4 py-8 text-center text-red-300">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message) + '<br><span class="text-[11px] text-slate-400">ตรวจสอบ Firestore Rules และชื่อ collection = cases</span></td></tr>';
  });
}

function renderDashboard(docs){
  const total = docs.length;
  let pending = 0, progress = 0, done = 0;
  docs.forEach(d=>{
    const s = (d.status||'').toLowerCase();
    if(s.includes('เสร็จ') || s==='done' || s==='completed' || s==='closed') done++;
    else if(s.includes('กำลัง') || s==='progress' || s==='in_progress' || s==='helping') progress++;
    else pending++;
  });
  document.getElementById('countTotal').textContent = String(total);
  document.getElementById('countPending').textContent = String(pending);
  document.getElementById('countProgress').textContent = String(progress);
  document.getElementById('countDone').textContent = String(done);
  const pct = (v)=> total ? Math.round((v/total)*100) : 0;
  document.getElementById('barPending').style.width = pct(pending) + '%';
  document.getElementById('barProgress').style.width = pct(progress) + '%';
  document.getElementById('barDone').style.width = pct(done) + '%';
  document.getElementById('lastUpdate').textContent = new Date().toLocaleString('th-TH') + ' • ' + total + ' เคส';
}

function renderMap(docs){
  if(!markerLayer) return;
  markerLayer.clearLayers();
  const bounds = [];
  docs.forEach(d=>{
    const ll = getLatLng(d);
    if(isNaN(ll.lat) || isNaN(ll.lng)) return;
    let cls = 'case-marker';
    const s = (d.status||'').toLowerCase();
    if(s.includes('ฉุกเฉิน') || (d.ai && Number(d.ai)>=80) || d.urgent) cls += ' urgent';
    else if(s.includes('กำลัง')) cls += ' progress';
    else if(s.includes('เสร็จ')) cls += ' done';
    const icon = L.divIcon({
      className: 'leaflet-div-icon',
      html: '<div class="' + cls + '">' + escapeHtml(d._caseCode) + '</div>',
      iconSize: [54,28],
      iconAnchor: [27,14]
    });
    const m = L.marker([ll.lat, ll.lng], {icon: icon}).addTo(markerLayer);
    const gmaps = 'https://www.google.com/maps?q=' + toFixed7(ll.lat) + ',' + toFixed7(ll.lng);
    const gdir = 'https://www.google.com/maps/dir/?api=1&destination=' + toFixed7(ll.lat) + ',' + toFixed7(ll.lng);
    m.bindPopup('<div style="font-family:Prompt,sans-serif;min-width:200px"><div style="font-weight:700;font-size:13px;margin-bottom:4px">' + escapeHtml(d._caseCode) + ' • ' + escapeHtml(d.name||'') + '</div><div style="font-size:12px;color:#475569">' + escapeHtml(d.detail||'').slice(0,120) + '</div><div style="margin-top:6px;font-size:11px;color:#64748b">GPS ' + toFixed7(ll.lat) + ', ' + toFixed7(ll.lng) + '</div><div style="margin-top:8px;display:flex;gap:6px"><a href="' + gmaps + '" target="_blank" style="font-size:12px;background:#0ea5e9;color:#fff;padding:4px 8px;border-radius:8px;text-decoration:none">Google Maps</a><a href="' + gdir + '" target="_blank" style="font-size:12px;background:#1e293b;color:#fff;padding:4px 8px;border-radius:8px;text-decoration:none">นำทาง</a></div></div>');
    m.on('click', ()=>{ const row = document.getElementById('row-' + d.id); if(row) row.scrollIntoView({behavior:'smooth', block:'center'}); row && row.classList.add('!bg-sky-950'); setTimeout(()=>row && row.classList.remove('!bg-sky-950'), 1500); });
    bounds.push([ll.lat, ll.lng]);
  });
  if(bounds.length){
    try{ map.fitBounds(bounds, {padding:[30,30], maxZoom:15}); }catch(e){}
  }
}

function renderTable(docs){
  const q = (searchInput.value || '').trim().toLowerCase();
  let filtered = docs;
  if(q){
    filtered = docs.filter(d=>{
      const hay = [d._caseCode, d.name, d.phone, d.detail, d.status, d.ai].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  if(filtered.length===0){
    tableBody.innerHTML = '';
    emptyState.classList.remove('hidden');
    emptyState.textContent = q ? 'ไม่พบผลการค้นหา "' + q + '"' : 'ยังไม่มีข้อมูล • รอการแจ้งเหตุใหม่';
    return;
  }
  emptyState.classList.add('hidden');
  const rows = filtered.map(d=>{
    const ll = getLatLng(d);
    const latTxt = isNaN(ll.lat) ? '-' : toFixed7(ll.lat);
    const lngTxt = isNaN(ll.lng) ? '-' : toFixed7(ll.lng);
    const gmaps = isNaN(ll.lat) ? '#' : 'https://www.google.com/maps?q=' + latTxt + ',' + lngTxt;
    const gdir = isNaN(ll.lat) ? '#' : 'https://www.google.com/maps/dir/?api=1&destination=' + latTxt + ',' + lngTxt;
    const aiScore = d.ai != null ? d.ai : (d.aiScore != null ? d.aiScore : (d.ai_score != null ? d.ai_score : ''));
    const aiBadge = aiScore !== '' ? '<span class="inline-flex px-2 py-0.5 rounded-full text-[11px] border ' + (Number(aiScore)>=75 ? 'bg-red-950 border-red-800 text-red-200' : Number(aiScore)>=40 ? 'bg-amber-950 border-amber-800 text-amber-200' : 'bg-slate-800 border-slate-700 text-slate-300') + '">' + escapeHtml(String(aiScore)) + '</span>' : '<span class="text-slate-500 text-[11px]">-</span>';
    const img = d.imageUrl || d.photoURL || d.image || '';
    const imgCell = img ? '<a href="' + escapeHtml(img) + '" target="_blank"><img src="' + escapeHtml(img) + '" class="w-14 h-14 rounded-xl object-cover border border-slate-700 hover:opacity-80" loading="lazy"/></a>' : '<span class="text-[11px] text-slate-500">ไม่มี</span>';
    const statusVal = d.status || 'รอดำเนินการ';
    return '<tr id="row-' + escapeHtml(d.id) + '" class="border-b border-slate-800 hover:bg-slate-800/60 transition">' +
      '<td class="px-3 py-2.5 whitespace-nowrap text-[11px] text-slate-300">' + escapeHtml(formatTime(d.createdAt)) + '</td>' +
      '<td class="px-3 py-2.5"><span class="inline-flex items-center px-2.5 py-1 rounded-full bg-sky-950 border border-sky-800 text-sky-200 text-[11px] font-bold tracking-wide">' + escapeHtml(d._caseCode) + '</span></td>' +
      '<td class="px-3 py-2.5 font-medium text-slate-100">' + escapeHtml(d.name||'-') + '</td>' +
      '<td class="px-3 py-2.5 whitespace-nowrap"><a href="tel:' + escapeHtml(d.phone||'') + '" class="text-sky-300 hover:underline">' + escapeHtml(d.phone||'-') + '</a></td>' +
      '<td class="px-3 py-2.5">' + aiBadge + '</td>' +
      '<td class="px-3 py-2.5 text-[11px] leading-tight"><div class="text-slate-200">' + latTxt + ', ' + lngTxt + '</div><div class="mt-1 flex gap-1"><a href="' + gmaps + '" target="_blank" class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 hover:bg-slate-700">Maps</a><a href="' + gdir + '" target="_blank" class="px-1.5 py-0.5 rounded bg-sky-900 border border-sky-800 text-sky-200 hover:bg-sky-800">นำทาง</a></div></td>' +
      '<td class="px-3 py-2.5">' + imgCell + '</td>' +
      '<td class="px-3 py-2.5 max-w-[260px]"><div class="line-clamp-3 text-[12px] text-slate-300 leading-snug">' + escapeHtml(d.detail||d.description||'-') + '</div></td>' +
      '<td class="px-3 py-2.5"><select data-id="' + escapeHtml(d.id) + '" class="statusSelect h-8 px-2 rounded-xl bg-slate-800 border border-slate-700 text-[12px]"><option value="รอดำเนินการ"' + (statusVal==='รอดำเนินการ' ? ' selected' : '') + '>รอดำเนินการ</option><option value="กำลังช่วยเหลือ"' + (statusVal==='กำลังช่วยเหลือ' ? ' selected' : '') + '>กำลังช่วยเหลือ</option><option value="เสร็จสิ้น"' + (statusVal==='เสร็จสิ้น' ? ' selected' : '') + '>เสร็จสิ้น</option><option value="ฉุกเฉิน"' + (statusVal==='ฉุกเฉิน' ? ' selected' : '') + '>ฉุกเฉิน</option></select></td>' +
      '<td class="px-3 py-2.5"><button data-del="' + escapeHtml(d.id) + '" class="delBtn h-8 px-2.5 rounded-xl bg-red-950 border border-red-800 text-red-200 text-[11px] hover:bg-red-900">ลบ</button></td>' +
    '</tr>';
  }).join('');
  tableBody.innerHTML = rows;

  // bind events
  tableBody.querySelectorAll('.statusSelect').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const id = e.target.getAttribute('data-id');
      const newStatus = e.target.value;
      try{
        await updateDoc(doc(db, 'cases', id), { status: newStatus, updatedAt: new Date() });
        showToast('อัปเดต ' + id + ' เป็น ' + newStatus);
      }catch(err){ showToast('อัปเดตไม่สำเร็จ: ' + err.message); }
    });
  });
  tableBody.querySelectorAll('.delBtn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.getAttribute('data-del');
      if(!confirm('ยืนยันลบเคส ' + id + ' ?')) return;
      try{ await deleteDoc(doc(db, 'cases', id)); showToast('ลบเคส ' + id + ' แล้ว'); }catch(err){ showToast('ลบไม่สำเร็จ: ' + err.message); }
    });
  });
}

searchInput.addEventListener('input', ()=>{ renderTable(allCasesSorted); });

// Export CSV - keep original functionality
exportBtn.addEventListener('click', ()=>{
  if(!allCasesSorted.length){ showToast('ไม่มีข้อมูลให้ Export'); return; }
  const header = ['เวลา','รหัสCASE-0001','ชื่อ','เบอร์','AI','GPS_lat_7หลัก','GPS_lng_7หลัก','GoogleMaps','ภาพ','รายละเอียด','สถานะ'];
  const lines = [header.join(',')];
  allCasesSorted.forEach(d=>{
    const ll = getLatLng(d);
    const lat = isNaN(ll.lat) ? '' : toFixed7(ll.lat);
    const lng = isNaN(ll.lng) ? '' : toFixed7(ll.lng);
    const gmaps = lat && lng ? 'https://www.google.com/maps?q=' + lat + ',' + lng : '';
    const time = formatTime(d.createdAt).replace(/,/g,' ');
    const row = [
      '"' + time.replace(/"/g,'""') + '"',
      d._caseCode,
      '"' + (d.name||'').replace(/"/g,'""') + '"',
      '"' + (d.phone||'').replace(/"/g,'""') + '"',
      '"' + (d.ai||d.aiScore||'') + '"',
      lat, lng,
      '"' + gmaps + '"',
      '"' + (d.imageUrl||d.photoURL||'') + '"',
      '"' + String(d.detail||d.description||'').replace(/"/g,'""').replace(/\\n/g,' ') + '"',
      '"' + (d.status||'') + '"'
    ];
    lines.push(row.join(','));
  });
  const blob = new Blob([lines.join('\\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'HatyaiRescue_CASE_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Export CSV ' + allCasesSorted.length + ' รายการแล้ว');
});

// Delete test cases - batch delete where phone 07435262 or name เจียม or detail contains ป่วย น้ำท่วม ป่วยฉุกเฉิน
deleteTestBtn.addEventListener('click', async ()=>{
  const keywords = ['ป่วย','น้ำท่วม','ป่วยฉุกเฉิน'];
  const matches = allCasesSorted.filter(d=>{
    const phone = (d.phone||'') + '';
    const name = (d.name||'') + '';
    const detail = (d.detail||d.description||'') + '';
    if(phone.indexOf('07435262') !== -1) return true;
    if(name.indexOf('เจียม') !== -1) return true;
    for(let k of keywords){ if(detail.indexOf(k) !== -1) return true; }
    return false;
  });
  if(matches.length===0){ showToast('ไม่พบเคสทดสอบตามเงื่อนไข'); return; }
  if(!confirm('พบเคสทดสอบ ' + matches.length + ' รายการ\\nเงื่อนไข: เบอร์ 07435262 / ชื่อ เจียม / รายละเอียด ป่วย น้ำท่วม ป่วยฉุกเฉิน\\nยืนยันลบทั้งหมด?')) return;
  deleteTestBtn.textContent = 'กำลังลบ ' + matches.length + '...';
  deleteTestBtn.disabled = true;
  let ok=0, fail=0;
  for(let m of matches){
    try{ await deleteDoc(doc(db, 'cases', m.id)); ok++; }catch(e){ fail++; }
  }
  deleteTestBtn.textContent = '\uD83D\uDDD1 ลบเคสทดสอบ';
  deleteTestBtn.disabled = false;
  showToast('ลบเคสทดสอบสำเร็จ ' + ok + ' รายการ' + (fail ? ' ล้มเหลว ' + fail : ''));
});

window._cases = ()=>allCasesSorted;
