<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>แจ้งเหตุ กู้ภัยหาดใหญ่ 1163 - บันทึก พ.ศ.</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');body{font-family:'Prompt',sans-serif}</style>
</head>
<body class="bg-gradient-to-b from-red-50 to-white min-h-screen">
<header class="bg-white shadow p-3 flex justify-between items-center sticky top-0 z-10">
<div>
<h1 class="font-bold text-red-600 text-sm">🚨 แจ้งเหตุกู้ภัยหาดใหญ่ 1163</h1>
<p class="text-[10px] text-slate-500">บันทึกวันที่ พ.ศ. + เวลาออนไลน์ | ส่งแล้วไซเรนดัง</p>
<p id="currentDateTime" class="text-[10px] text-blue-600 font-bold"></p>
<p id="statusBar" class="text-[10px] text-emerald-600">✅ พร้อมส่ง</p>
</div>
<a href="staff.html" class="bg-slate-900 text-white px-3 py-1 rounded-full text-[10px]">ศูนย์บัญชาการ</a>
</header>
<main class="max-w-md mx-auto p-3">
<div class="bg-white rounded-2xl shadow p-4">
<form id="rescueForm" class="space-y-3">
<input id="name" required placeholder="ชื่อผู้ประสบภัย * เช่น เจียม" class="w-full p-3 bg-slate-50 border rounded-xl">
<input id="phone" type="tel" required placeholder="เบอร์โทร * เช่น 07435262" class="w-full p-3 bg-slate-50 border rounded-xl">
<textarea id="detail" required rows="3" placeholder="รายละเอียด เช่น น้ำท่วม จมน้ำ หมดสติ" class="w-full p-3 bg-slate-50 border rounded-xl" oninput="updateAI()"></textarea>
<div class="bg-purple-50 border rounded-xl p-2 text-[11px]"><span id="aiBadge">🤖 AI: รอวิเคราะห์</span><div id="aiBox" class="text-[10px]">พิมพ์อาการ</div></div>
<div class="bg-blue-50 border border-blue-200 rounded-xl p-2 text-[10px]"><div class="font-bold text-blue-800">📅 บันทึกอัตโนมัติ:</div><div id="previewDate" class="mt-1 text-slate-600">-</div></div>
<div><button type="button" onclick="getGPS()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold text-sm">📍 ดึงพิกัด GPS</button><p id="gpsStatus" class="text-[10px] text-center mt-1 text-red-500">ยังไม่ได้ดึง GPS</p></div>
<label class="flex gap-2 text-[10px]"><input type="checkbox" checked required> ยินยอม PDPA</label>
<button type="submit" id="submitBtn" class="w-full bg-red-600 text-white p-4 rounded-xl font-bold">🚀 ส่งขอความช่วยเหลือ</button>
<div id="debugBox" class="bg-slate-50 border rounded-xl p-2 text-[10px]"><b>Debug:</b> <span id="debugMsg">พร้อม</span></div>
<div id="restBox" class="bg-blue-50 border rounded-xl p-2 text-[10px] hidden"><b>REST:</b> <span id="restMsg">-</span></div>
<div id="errorBox" class="bg-red-50 border border-red-200 rounded-xl p-2 text-[10px] hidden"><b>❌ Error:</b> <span id="errorMsg"></span><pre id="errorDetail" class="text-[9px] whitespace-pre-wrap"></pre></div>
</form>
<div class="mt-4 grid grid-cols-3 gap-2 text-center text-[10px]">
<a href="tel:1163" class="bg-red-600 text-white p-2 rounded-xl font-bold">🚑 1163</a>
<a href="tel:074350955" class="bg-slate-900 text-white p-2 rounded-xl">📞 074-350955</a>
<a href="tel:1669" class="bg-emerald-600 text-white p-2 rounded-xl">🏥 1669</a>
</div>
<button onclick="testFirestore()" class="mt-3 w-full bg-slate-100 p-2 rounded-xl text-[10px]">🧪 ทดสอบเชื่อมต่อ</button>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs",
  authDomain: "hatyai-rescue.firebaseapp.com",
  projectId: "hatyai-rescue",
  storageBucket: "hatyai-rescue.firebasestorage.app",
  messagingSenderId: "489517472133",
  appId: "1:489517472133:web:bf6769bbd62f312cbd0cec"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


function getThaiDateTime() {
  const now = new Date();
  const beYear = now.getFullYear() + 543;
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const monthsShort = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const day = now.getDate(); const month = now.getMonth(); const yearBE = beYear;
  const hours = String(now.getHours()).padStart(2,'0'); const mins = String(now.getMinutes()).padStart(2,'0'); const secs = String(now.getSeconds()).padStart(2,'0');
  return {
    now, timestamp: now.getTime(), iso: now.toISOString(), beYear: yearBE,
    thaiFull: `${day} ${months[month]} ${yearBE}`,
    thaiShort: `${day} ${monthsShort[month]} ${yearBE}`,
    dateBE: `${String(day).padStart(2,'0')}/${String(month+1).padStart(2,'0')}/${yearBE}`,
    time: `${hours}:${mins}:${secs}`,
    timeWithDate: `${String(day).padStart(2,'0')}/${String(month+1).padStart(2,'0')}/${yearBE} ${hours}:${mins}:${secs}`,
    logTime: `${day} ${months[month]} ${yearBE} เวลา ${hours}:${mins}:${secs} น.`,
    logTimeShort: `${String(day).padStart(2,'0')}/${String(month+1).padStart(2,'0')}/${yearBE} ${hours}:${mins}`,
    onlineDate: now.toLocaleDateString('th-TH', {year:'numeric', month:'long', day:'numeric'}),
    onlineTime: now.toLocaleTimeString('th-TH'),
    onlineDateTime: now.toLocaleString('th-TH'),
    dayName: now.toLocaleDateString('th-TH', {weekday:'long'}),
    day, month: month+1, monthName: months[month], monthShort: monthsShort[month],
    yearAD: now.getFullYear(), yearBE, hours, minutes: mins, seconds: secs,
    dateKey: `${yearBE}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
  };
}
function timeoutPromise(promise, ms, msg){
  let tid; const timeout = new Promise((_, rej)=>{ tid=setTimeout(()=>rej(new Error(msg)), ms); });
  return Promise.race([promise, timeout]).finally(()=>clearTimeout(tid));
}


let lat=null,lng=null;
function updateCurrentTime(){
  const dt=getThaiDateTime();
  document.getElementById('currentDateTime').innerText=`📅 ${dt.thaiShort} | ⏰ ${dt.time} | ${dt.dayName}`;
  document.getElementById('previewDate').innerHTML=`วันที่: ${dt.thaiFull} (พ.ศ. ${dt.beYear})<br>เวลา: ${dt.time} น.<br>ระบบ: ${dt.dateBE} ${dt.time}<br>ออนไลน์: ${dt.onlineDateTime}`;
}
setInterval(updateCurrentTime,1000); updateCurrentTime();

window.getGPS=()=>{
  document.getElementById('gpsStatus').innerText='⏳ ดึง GPS...';
  navigator.geolocation.getCurrentPosition(p=>{
    lat=p.coords.latitude; lng=p.coords.longitude;
    document.getElementById('gpsStatus').innerHTML=`✅ ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  },e=>{document.getElementById('gpsStatus').innerText='❌ '+e.message;},{enableHighAccuracy:true});
};

function aiAnalyze(t){
  const s=t.toLowerCase(); let score=0;
  if(s.match(/หมดสติ|ไม่หายใจ/)) score+=100;
  if(s.match(/จมน้ำ|ไฟดูด/)) score+=90;
  if(s.match(/หายใจไม่ออก|แน่นหน้าอก/)) score+=80;
  if(s.match(/เลือดออก|ชัก/)) score+=75;
  if(s.match(/ติดเตียง/)) score+=70;
  if(s.match(/น้ำท่วม/)) score+=50;
  if(score>=70) return {label:'แดง - วิกฤต', triage:'🔴', level:3, score};
  if(score>=35) return {label:'เหลือง - ปานกลาง', triage:'🟡', level:2, score};
  return {label:'เขียว - เล็กน้อย', triage:'🟢', level:1, score};
}
window.updateAI=()=>{
  const ai=aiAnalyze(document.getElementById('detail').value);
  document.getElementById('aiBadge').innerText=`${ai.triage} ${ai.label} (${ai.score})`;
  document.getElementById('aiBox').innerText=`อาการ: ${ai.label}`;
};

async function sendViaREST(docData){
  const restBox=document.getElementById('restBox'); const restMsg=document.getElementById('restMsg');
  restBox.classList.remove('hidden'); restMsg.innerText='ส่งผ่าน REST...';
  const url=`https://firestore.googleapis.com/v1/projects/hatyai-rescue/databases/(default)/documents/cases`;
  const payload={fields:{
    id:{stringValue:docData.id}, name:{stringValue:docData.name}, phone:{stringValue:docData.phone},
    detail:{stringValue:docData.detail}, lat:{doubleValue:docData.lat}, lng:{doubleValue:docData.lng},
    priority:{integerValue:String(docData.priority)}, status:{stringValue:docData.status},
    timestamp:{integerValue:String(docData.timestamp)}, dateBE:{stringValue:docData.dateBE},
    timeBE:{stringValue:docData.timeBE}, thaiShort:{stringValue:docData.thaiShort},
    logTime:{stringValue:docData.logTime}, onlineDateTime:{stringValue:docData.onlineDateTime},
    yearBE:{integerValue:String(docData.yearBE)}, month:{integerValue:String(docData.month)},
    day:{integerValue:String(docData.day)}, dateKey:{stringValue:docData.dateKey}
  }};
  const res=await fetch(url,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  const data=await res.json();
  if(!res.ok) throw new Error('REST '+res.status+' '+JSON.stringify(data).slice(0,300));
  restMsg.innerText='✅ REST สำเร็จ: '+data.name;
  return data;
}

window.testFirestore=async()=>{
  const debug=document.getElementById('debugMsg');
  debug.innerText='ทดสอบ...';
  try{
    const dt=getThaiDateTime();
    const testDoc={id:'TEST-'+dt.timestamp.toString().slice(-4), name:'ทดสอบ', phone:'0000000000', detail:'ทดสอบเชื่อมต่อ', lat:7.008, lng:100.4747, priority:1, timestamp:dt.timestamp, dateBE:dt.dateBE, timeBE:dt.time};
    const ref=await timeoutPromise(addDoc(collection(db,'cases'), testDoc), 8000, 'Timeout 8s');
    debug.innerText='✅ เชื่อมต่อได้ ID:'+ref.id;
    alert('✅ Firestore ปกติ: '+ref.id);
  }catch(e){
    debug.innerText='❌ '+e.message;
    document.getElementById('errorBox').classList.remove('hidden');
    document.getElementById('errorMsg').innerText=e.message;
  }
};

document.getElementById('rescueForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if(lat===null){ alert('กด GPS ก่อน'); return; }
  const btn=document.getElementById('submitBtn'); const debug=document.getElementById('debugMsg');
  const errorBox=document.getElementById('errorBox'); const restBox=document.getElementById('restBox');
  btn.disabled=true; btn.innerText='⏳ กำลังส่ง...'; debug.innerText='กำลังส่ง...'; errorBox.classList.add('hidden'); restBox.classList.add('hidden');
  try{
    const dt=getThaiDateTime(); const ai=aiAnalyze(document.getElementById('detail').value);
    const docData={
      id:'CASE-'+dt.timestamp.toString().slice(-6), name:document.getElementById('name').value.trim(),
      phone:document.getElementById('phone').value.trim(), detail:document.getElementById('detail').value.trim(),
      ai, priority:ai.level, priorityLabel:ai.label, lat:Number(lat), lng:Number(lng), status:'รอช่วยเหลือ',
      timestamp:dt.timestamp, createdAt:serverTimestamp(),
      dateBE:dt.dateBE, timeBE:dt.time, dateTimeBE:dt.timeWithDate, thaiFull:dt.thaiFull, thaiShort:dt.thaiShort,
      logTime:dt.logTime, logTimeShort:dt.logTimeShort, day:dt.day, month:dt.month, monthName:dt.monthName,
      yearAD:dt.yearAD, yearBE:dt.yearBE, dayName:dt.dayName, onlineDate:dt.onlineDate, onlineTime:dt.onlineTime,
      onlineDateTime:dt.onlineDateTime, iso:dt.iso, dateKey:dt.dateKey, source:'public_thai_be_v2_siren_fix'
    };
    debug.innerText='ส่ง: '+dt.logTimeShort;
    let ref;
    try{
      ref=await timeoutPromise(addDoc(collection(db,'cases'), docData), 10000, 'SDK ค้าง 10วิ -> ลอง REST');
      debug.innerText='✅ SDK สำเร็จ: '+ref.id+' | '+dt.logTimeShort;
    }catch(sdkErr){
      debug.innerText='⚠️ SDK: '+sdkErr.message+' -> ลอง REST';
      document.getElementById('errorBox').classList.remove('hidden');
      document.getElementById('errorMsg').innerText='SDK: '+sdkErr.message;
      try{
        await sendViaREST(docData);
        debug.innerText='✅ REST สำเร็จแทน! '+dt.logTimeShort;
        alert(`✅ ส่งสำเร็จผ่าน REST!\n${ai.triage} ${ai.label}\nรหัส: ${docData.id}\nวันที่: ${dt.thaiShort} ${dt.time} น.\n\nศูนย์ได้รับแล้ว ไซเรนจะดัง`);
        e.target.reset(); lat=null; document.getElementById('gpsStatus').innerText='ยังไม่ได้ดึง GPS';
        btn.disabled=false; btn.innerText='🚀 ส่งขอความช่วยเหลือ'; return;
      }catch(restErr){ throw new Error('SDK: '+sdkErr.message+' | REST: '+restErr.message); }
    }
    try{ await addDoc(collection(db,'logs'), docData); }catch(_ ){}
    alert(`✅ ส่งสำเร็จ!\n${ai.triage} ${ai.label}\nรหัส: ${docData.id}\nวันที่: ${dt.thaiShort} ${dt.time} น.\n\nศูนย์ได้รับแล้ว + ไซเรนจะดัง`);
    e.target.reset(); lat=null; document.getElementById('gpsStatus').innerText='ยังไม่ได้ดึง GPS';
  }catch(err){
    debug.innerText='❌ '+err.message;
    document.getElementById('errorBox').classList.remove('hidden');
    document.getElementById('errorMsg').innerText=err.message;
    document.getElementById('errorDetail').innerText=(err.code||'')+'\n'+(err.stack||'').slice(0,600);
    alert('❌ ส่งไม่สำเร็จ: '+err.message);
  }finally{ btn.disabled=false; btn.innerText='🚀 ส่งขอความช่วยเหลือ'; }
});
</script>
</body>
</html>
