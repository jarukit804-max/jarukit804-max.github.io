<form id="rescueForm" class="space-y-3">

<input id="phone" type="tel" required placeholder="เบอร์โทร *" class="w-full p-3 bg-slate-50 border rounded-xl">
<textarea id="detail" required rows="3" placeholder="รายละเอียด + อาการผู้ป่วย" class="w-full p-3 bg-slate-50 border rounded-xl" oninput="updateAI()"></textarea>

<script type="module">
// === CONFIG - ใส่ค่าจาก Firebase Console ===
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs",
  authDomain: "hatyai-rescue.firebaseapp.com",
  projectId: "hatyai-rescue",
  storageBucket: "hatyai-rescue.firebasestorage.app",
  messagingSenderId: "489517472133",
  appId: "1:489517472133:web:bf6769bbd62f312cbd0cec",
  measurementId: "G-1WBXP3RKC3"
};
// Firebase Production - hatyai-rescue

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let lat=null,lng=null,photoFiles=[];
window.getGPS=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    lat=p.coords.latitude; lng=p.coords.longitude;
    document.getElementById('gpsStatus').innerHTML=`✅ ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  },()=>{alert('เปิด GPS และอนุญาต');});
};

function aiAnalyze(t){
  const s=t.toLowerCase(); let score=0; let sym=[];
  if(s.match(/หมดสติ|ไม่หายใจ/)){score+=100; sym.push('หมดสติ');}
  if(s.match(/จมน้ำ|ไฟดูด/)){score+=90; sym.push('จมน้ำ/ไฟดูด');}
  if(s.match(/หายใจไม่ออก|แน่นหน้าอก/)){score+=80; sym.push('หายใจลำบาก');}
  if(s.match(/เลือดออก|ชัก/)){score+=75; sym.push('เลือดออก/ชัก');}
  if(s.match(/ติดเตียง/)){score+=70; sym.push('ติดเตียง');}
  if(s.match(/เด็กอ่อน|ตั้งครรภ์/)){score+=60; sym.push('เด็กอ่อน/ตั้งครรภ์');}
  if(score>=70) return {label:'แดง - วิกฤต',score,keywords:sym.join(','),triage:'🔴',level:3,advice:'ช่วยทันที'};
  if(score>=35) return {label:'เหลือง - ปานกลาง',score,keywords:sym.join(','),triage:'🟡',level:2,advice:'30นาที'};
  return {label:'เขียว - เล็กน้อย',score,keywords:sym.join(','),triage:'🟢',level:1,advice:'2ชม.'};
}
window.updateAI=()=>{
  const ai=aiAnalyze(document.getElementById('detail').value);
  document.getElementById('aiBadge').innerText=`${ai.triage} ${ai.label} (${ai.score})`;
  document.getElementById('aiBox').innerText=`อาการ: ${ai.keywords||'ทั่วไป'} | ${ai.advice}`;
};

document.getElementById('photos').addEventListener('change',e=>{
  photoFiles=Array.from(e.target.files).slice(0,3);
  const pre=document.getElementById('photoPreview'); pre.innerHTML='';
  photoFiles.forEach(f=>{
    const r=new FileReader(); r.onload=ev=>{const img=document.createElement('img'); img.src=ev.target.result; img.className='w-full h-16 object-cover rounded-lg border'; pre.appendChild(img);}; r.readAsDataURL(f);
  });
});

document.getElementById('rescueForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(lat===null){alert('กด GPS ก่อน'); return;}
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.innerText='กำลังส่ง...';
  try{
    const detail=document.getElementById('detail').value;
    const ai=aiAnalyze(detail);
    let photoUrls=[];
    for(let i=0;i<photoFiles.length;i++){
      const file=photoFiles[i];
      const storageRef=ref(storage, `cases/${Date.now()}_${file.name}`);
      await uploadBytes(storageRef,file);
      const url=await getDownloadURL(storageRef);
      photoUrls.push(url);
    }
    const docData={
      id:'CASE-'+Date.now().toString().slice(-6),
      name:document.getElementById('name').value,
      phone:document.getElementById('phone').value,
      detail, ai, priority:ai.level, priorityLabel:ai.label,
      lat,lng, status:'รอช่วยเหลือ',
      photos:photoUrls,
      createdAt:serverTimestamp(),
      logTime:new Date().toLocaleString('th-TH'),
      source:'public_production'
    };
    await addDoc(collection(db,'cases'),docData);
    await addDoc(collection(db,'logs'),docData);
    alert(`✅ ส่งสำเร็จ! ${ai.triage} ${ai.label}\nศูนย์ได้รับแล้ว + ไซเรนดัง`);
    e.target.reset(); lat=null; lng=null; photoFiles=[]; document.getElementById('photoPreview').innerHTML=''; document.getElementById('gpsStatus').innerText='ยังไม่ได้ดึงพิกัด';
  }catch(err){ console.error(err); alert('ส่งไม่สำเร็จ: '+err.message); }
  btn.disabled=false; btn.innerText='🚀 ส่งขอความช่วยเหลือ';
});
</script>
</body>
