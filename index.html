<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>แจ้งเหตุ FIXED V4 | Hatyai Rescue</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Prompt',sans-serif}</style>
</head>
<body class="bg-gradient-to-b from-red-50 to-white min-h-screen">
<header class="bg-white shadow p-3 flex justify-between items-center">
<div><h1 class="font-bold text-red-600 text-sm">🚨 แจ้งเหตุ FIXED V4</h1><p class="text-[10px] text-slate-500">ไม่ใช้รูป ไม่ใช้ orderBy - ส่งได้ชัวร์</p><p id="statusBar" class="text-[10px] text-emerald-600">✅ พร้อม</p></div>
<a href="staff.html" class="bg-slate-900 text-white px-3 py-1 rounded-full text-[10px]">ศูนย์บัญชาการ</a>
</header>
<main class="max-w-md mx-auto p-3">
<div class="bg-white rounded-2xl shadow p-4">
<form id="rescueForm" class="space-y-3">
<input id="name" required placeholder="ชื่อ *" class="w-full p-3 bg-slate-50 border rounded-xl">
<input id="phone" required placeholder="เบอร์ *" class="w-full p-3 bg-slate-50 border rounded-xl">
<textarea id="detail" required rows="3" placeholder="เช่น จมน้ำ น้ำท่วม" class="w-full p-3 bg-slate-50 border rounded-xl" oninput="updateAI()">จมน้ำ หมดสติ</textarea>
<div class="bg-purple-50 border rounded-xl p-2 text-[11px]"><span id="aiBadge">🤖 AI</span><div id="aiBox" class="text-[10px]">พิมพ์เพื่อวิเคราะห์</div></div>
<div><button type="button" onclick="getGPS()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold text-sm">📍 ดึงพิกัด GPS</button><p id="gpsStatus" class="text-[10px] text-center mt-1 text-red-500">ยังไม่ได้ดึง GPS</p></div>
<button type="submit" id="submitBtn" class="w-full bg-red-600 text-white p-4 rounded-xl font-bold">🚀 ส่งขอความช่วยเหลือ</button>
<div id="debugBox" class="bg-slate-50 border rounded-xl p-2 text-[10px] mt-2"><b>Debug:</b> <span id="debugMsg">พร้อม</span></div>
</form>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCVzC5QZvu0piiXC7pdkstfAVl7-yLYrRs",
  authDomain: "hatyai-rescue.firebaseapp.com",
  projectId: "hatyai-rescue",
  storageBucket: "hatyai-rescue.firebasestorage.app",
  messagingSenderId: "489517472133",
  appId: "1:489517472133:web:bf6769bbd62f312cbd0cec"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let lat=null,lng=null;
window.getGPS=()=>{
  document.getElementById('gpsStatus').innerText='⏳ ดึง GPS...';
  navigator.geolocation.getCurrentPosition(p=>{ lat=p.coords.latitude; lng=p.coords.longitude; document.getElementById('gpsStatus').innerHTML=`✅ ${lat.toFixed(6)}, ${lng.toFixed(6)}`; document.getElementById('debugMsg').innerText='GPS: '+lat+','+lng; },e=>{ document.getElementById('gpsStatus').innerText='❌ '+e.message; },{enableHighAccuracy:true});
};
function aiAnalyze(t){
  const s=t.toLowerCase(); let score=0;
  if(s.match(/หมดสติ|ไม่หายใจ/)) score+=100;
  if(s.match(/จมน้ำ|ไฟดูด/)) score+=90;
  if(score>=70) return {label:'แดง - วิกฤต', triage:'🔴', level:3, score};
  if(score>=35) return {label:'เหลือง - ปานกลาง', triage:'🟡', level:2, score};
  return {label:'เขียว - เล็กน้อย', triage:'🟢', level:1, score};
}
window.updateAI=()=>{
  const ai=aiAnalyze(document.getElementById('detail').value);
  document.getElementById('aiBadge').innerText=`${ai.triage} ${ai.label}`;
  document.getElementById('aiBox').innerText=`Score ${ai.score}`;
};
updateAI();
document.getElementById('rescueForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(lat===null){ alert('กด GPS ก่อน'); return; }
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.innerText='⏳ ส่ง...';
  document.getElementById('debugMsg').innerText='ส่งไป Firestore...';
  try{
    const now=Date.now();
    const docData={ id:'CASE-'+now.toString().slice(-6), name:document.getElementById('name').value, phone:document.getElementById('phone').value, detail:document.getElementById('detail').value, ai:aiAnalyze(document.getElementById('detail').value), priority:aiAnalyze(document.getElementById('detail').value).level, lat:Number(lat), lng:Number(lng), status:'รอช่วยเหลือ', timestamp:now, createdAt:serverTimestamp(), logTime:new Date().toLocaleString('th-TH') };
    const ref=await addDoc(collection(db,'cases'), docData);
    try{ await addDoc(collection(db,'logs'), docData); }catch(_){}
    document.getElementById('debugMsg').innerText='✅ สำเร็จ ID:'+ref.id;
    alert('✅ ส่งสำเร็จ! '+docData.id);
    e.target.reset(); lat=null; document.getElementById('gpsStatus').innerText='ยังไม่ได้ดึง GPS'; updateAI();
  }catch(err){ document.getElementById('debugMsg').innerText='❌ '+err.code+' '+err.message; alert('ส่งไม่สำเร็จ: '+err.message); }
  finally{ btn.disabled=false; btn.innerText='🚀 ส่งขอความช่วยเหลือ'; }
});
</script>
</body>
</html>
